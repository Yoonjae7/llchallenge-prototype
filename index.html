    function SlideBody({ slide, name, reveal, theme, innerRef, onScroll, active }) {
      const paras = parasOf(slide, name);
      const hasImg = !!(slide.img && DATA.SHOTS[slide.img]);
      const videoRef = useRef(null);
      /* 슬라이드가 화면에 실제로 들어올 때만 영상을 재생한다(모든 슬라이드가 미리 마운트돼 있어서 autoPlay만으로는 안 보이는 곳에서 먼저 끝나버림) */
      useEffect(() => {
        const v = videoRef.current;
        if (!v) return;
        if (active) { v.currentTime = 0; v.play().catch(() => {}); }
        else v.pause();
      }, [active, slide.video]);

      /* 캔버스(덱 박스)는 그대로 두고 내용을 캔버스에 맞춘다.
         내용이 넘치면 스크롤 대신 살짝 줄여 한 화면에 담고, 짧으면 세로 가운데로 모아
         아래쪽에 빈 공간이 크게 남지 않게 한다. scrollHeight 는 transform 의 영향을
         받지 않는 레이아웃 높이라서 축소된 상태에서 다시 재도 원래 높이가 나온다. */
      const boxRef = useRef(null);
      const sizerRef = useRef(null);
      const contentRef = useRef(null);
      const attachBox = useCallback((el) => {
        boxRef.current = el;
        if (innerRef) innerRef.current = el;
      }, [innerRef]);

      useLayoutEffect(() => {
        const box = boxRef.current, el = contentRef.current, sizer = sizerRef.current;
        if (!box || !el || !sizer || !active) return;
        let raf = 0;
        const vid = el.querySelector("video, figure img");
        const apply = () => {
          /* 항상 원래 크기로 되돌린 뒤 다시 잰다. 영상은 메타데이터가 늦게 와서
             높이가 나중에 바뀌는데, 줄여둔 상태에서 재면 값이 어긋난다. */
          el.style.transform = "none";
          sizer.style.height = "auto";
          if (vid) vid.style.maxHeight = "";
          const cs = getComputedStyle(box);
          const avail = box.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
          let need = el.scrollHeight;
          /* 글까지 같이 줄이기 전에 영상·이미지부터 양보시킨다. 글씨 크기를 지키는 쪽이 읽기 좋다 */
          if (need > avail && vid) {
            const vh = vid.getBoundingClientRect().height;
            const room = Math.max(220, avail - (need - vh));
            if (room < vh) { vid.style.maxHeight = room + "px"; need = el.scrollHeight; }
          }
          if (avail > 0 && need > avail) {
            const s = Math.max(.74, avail / need);
            el.style.transform = "scale(" + s + ")";
            el.style.transformOrigin = "top center";
            sizer.style.height = Math.ceil(need * s) + "px";
            sizer.style.overflow = "hidden";
            box.classList.remove("justify-center");
          } else {
            sizer.style.overflow = "";
            box.classList.add("justify-center");
          }
        };
        /* 첫 계산은 그리기 전에 바로 하고, 이후 변화(영상 로드·폰트 로드·창 크기)만 모아서 다시 잰다.
           폰트가 늦게 적용되면 주변 글줄 높이가 바뀌어 가용 높이가 살짝 달라지는데, 그 보정을 놓치면
           같은 슬라이드인데도 처음 볼 때와 나중에 다시 볼 때 크기가 달라 보인다.
           reveal 은 의존성에 넣지 않는다 - 문단은 안 열렸을 때도 이미 공간을 차지하고 있어서(visibility만
           숨김) 다시 잴 필요가 없고, 오히려 넣으면 다음 버튼을 누를 때마다 재계산이 돌면서 영상·글씨
           크기가 미세하게 늘었다 줄었다 하는 게 보였다. 슬라이드에 들어올 때 딱 한 번만 재서 그 크기로
           고정해야 클릭할 때마다 크기가 흔들리지 않는다 */
        apply();
        const schedule = () => { clearTimeout(raf); raf = setTimeout(apply, 0); };
        const ro = new ResizeObserver(schedule);
        ro.observe(box);
        if (vid) { vid.addEventListener("loadedmetadata", schedule); vid.addEventListener("load", schedule); }
        window.addEventListener("resize", schedule);
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(schedule);
        return () => {
          clearTimeout(raf); ro.disconnect();
          window.removeEventListener("resize", schedule);
          if (vid) { vid.removeEventListener("loadedmetadata", schedule); vid.removeEventListener("load", schedule); }
        };
      }, [active, slide, name]);
      return (
        <div ref={attachBox} onScroll={onScroll || undefined}
          className="h-full overflow-y-auto overscroll-y-contain no-scrollbar px-5 sm:px-7 py-5 sm:py-6 flex flex-col justify-center">
        <div ref={sizerRef} className="w-full shrink-0">
        <div ref={contentRef}>
          <h2 className="text-base sm:text-xl font-black leading-snug text-ink">
            <RichInline text={slide.title} name={name} />
          </h2>
          <div className={"mt-1.5 h-1 w-9 rounded-full " + theme.bar} />
          {slide.video && (
            <video ref={videoRef} src={slide.video} muted playsInline loop={slide.videoLoop !== false}
              className="mt-3.5 mx-auto w-auto max-w-full max-h-[54vh] sm:max-h-[68vh] rounded-2xl shadow-soft" />
          )}
          {slide.featureCards ? (
            /* 눌러서 펼치는 기능 카드 그리드. paras[0]을 인트로 문장으로 쓰고, 설명은 카드 클릭으로
               직접 펼쳐 보게 해 이모지 목록보다 손이 가는 슬라이드로 만든다 */
            <div className="mt-3.5">
              <FeatureCardsGrid intro={paras[0]} cards={slide.featureCards} outro={slide.featureNote} active={active} />
            </div>
          ) : slide.quadVisuals ? (
            /* 2x2 사분면. 네 개가 슬라이드에 들어오는 순간 한 번에 다 뜬다 - 캡션은 문단 reveal과
               무관한 별도 필드(quadCaps)라서 클릭 스텝을 잡아먹지 않는다.
               active가 바뀔 때마다 key로 강제 리마운트해 아이콘 애니메이션을 다시 들어올 때마다 처음부터 재생시킨다 */
            <div key={active ? "quad-on" : "quad-off"}>
              <p className="rich mt-3.5 text-[14px] sm:text-[14.5px] text-gray-700 leading-[1.7]"
                 dangerouslySetInnerHTML={{ __html: (paras[0] || "").split("\n").join("<br/>") }} />
              <div className="mt-4 grid grid-cols-2 gap-2.5 sm:gap-3.5">
              {slide.quadVisuals.map((kind, i) => (
                <div key={i} className="rounded-2xl border border-brand-100 bg-brand-50/40 p-3 sm:p-4 flex flex-col items-center justify-center text-center gap-2.5"
                  style={{ animation: "revealUp .45s " + (i * .1) + "s both" }}>
                  <RoadmapVisual kind={kind} />
                  <p className="rich text-[12px] sm:text-[13px] text-gray-700 leading-[1.6]"
                     dangerouslySetInnerHTML={{ __html: ((slide.quadCaps && slide.quadCaps[i]) || "").split("\n").join("<br/>") }} />
                </div>
              ))}
              </div>
            </div>
          ) : slide.visual ? (
            /* 그림이 주인공이라 칸을 더 준다(3:2). 그림은 슬라이드에 들어오는 순간 통째로 뜨고, 옆의 글만 클릭으로 한 문단씩 열린다 */
            <div className="mt-4 grid sm:grid-cols-[3fr_2fr] gap-4 sm:gap-5 items-center">
              <div key={active ? "vis-on" : "vis-off"} className="animate-revealUp">
                <SlideVisual kind={slide.visual} />
              </div>
              <div className="space-y-2.5">
                {paras.map((p, i) => (
                  <RevealPara key={i} i={i} reveal={reveal}><ParaBlock html={p} /></RevealPara>
                ))}
              </div>
            </div>
          ) : hasImg ? (
            /* 실제 화면 캡처도 그림이 주인공이니 visual과 같은 3:2 레이아웃을 쓴다 - 문단 아래
               작게 깔리던 걸 왼쪽 큰 칸으로 옮기니 캡처 속 글자까지 읽힌다. 이미지는 슬라이드에
               들어오는 순간 통째로 뜨고(reveal 계단에 안 묶임), 옆 글만 클릭으로 한 문단씩 연다 */
            <div className="mt-4 grid sm:grid-cols-[3fr_2fr] gap-4 sm:gap-5 items-center">
              <figure key={active ? "img-on" : "img-off"} className="animate-revealUp">
                <img src={DATA.SHOTS[slide.img]} alt={slide.imgCap || ""} title="클릭하면 원본 크기로 열려요"
                  onClick={() => { const w = window.open(); if (w) w.document.write('<img src="' + DATA.SHOTS[slide.img] + '" style="max-width:100%">'); }}
                  className="mx-auto w-auto max-w-full max-h-[34vh] sm:max-h-[46vh] object-contain rounded-2xl border border-gray-200 shadow-soft cursor-zoom-in" />
                {slide.imgCap && <figcaption className="mt-2 text-center text-xs text-gray-400">{slide.imgCap}</figcaption>}
              </figure>
              <div className="space-y-2.5">
                {paras.map((p, i) => (
                  <RevealPara key={i} i={i} reveal={reveal}><ParaBlock html={p} /></RevealPara>
                ))}
              </div>
            </div>
          ) : (
            <div className="mt-3.5 space-y-2.5">
              {paras.map((p, i) => (
                <RevealPara key={i} i={i} reveal={reveal}><ParaBlock html={p} /></RevealPara>
              ))}
            </div>
          )}
          {PLAN_NOTES && slide.note && (
            <div className="mt-4 rounded-xl bg-gray-50 border border-dashed border-gray-300 p-3 text-xs text-gray-500 leading-relaxed">
              <b className="text-gray-600">기획 노트</b> : {slide.note}
            </div>
          )}
        </div>
        </div>
        </div>
      );
    }

    function SlideDeck({ slides, theme, name, onFinish, finishLabel, dayNum }) {
      const [i, setI] = useState(0);
      const [step, setStep] = useState(1);
      const [dir, setDir] = useState(1);
      const total = slides.length;
      const scrollRef = useRef(null);
      const prevPos = useRef({ i: 0, step: 1 });
      const [more, setMore] = useState(false);

      const curSteps = stepsOf(slides[i], name);
      const finished = i === total - 1 && step >= curSteps;

      const allSteps = useMemo(() => slides.map((s) => stepsOf(s, name)), [slides, name]);
      const totalSteps = allSteps.reduce((a, b) => a + b, 0);
      const doneSteps = allSteps.slice(0, i).reduce((a, b) => a + b, 0) + step;

      const next = useCallback(() => {
        if (step < curSteps) return setStep(step + 1);
        if (i < total - 1) { setDir(1); setI(i + 1); setStep(1); }
      }, [i, step, curSteps, total]);
      const prev = useCallback(() => {
        if (step > 1) return setStep(step - 1);
        if (i > 0) { setDir(-1); setI(i - 1); setStep(stepsOf(slides[i - 1], name)); }
      }, [i, step, slides, name]);
      const jump = useCallback((n) => { setDir(n > i ? 1 : -1); setI(n); setStep(stepsOf(slides[n], name)); }, [i, slides, name]);

      useEffect(() => {
        const on = (e) => {
          if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
          if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); next(); }
          else if (e.key === "ArrowLeft") { e.preventDefault(); prev(); }
        };
        window.addEventListener("keydown", on);
        return () => window.removeEventListener("keydown", on);
      }, [next, prev]);

      /* autoReveal 슬라이드는 탭 없이도 항목이 하나씩 순서대로 나타난다 */
      useEffect(() => {
        if (!slides[i].autoReveal || step >= curSteps) return;
        const t = setTimeout(() => setStep((s) => Math.min(s + 1, curSteps)), 750);
        return () => clearTimeout(t);
      }, [i, step, curSteps, slides]);

      const syncMore = useCallback(() => {
        const el = scrollRef.current;
        setMore(!!el && el.scrollHeight - el.scrollTop - el.clientHeight > 8);
      }, []);

      useEffect(() => {
        const el = scrollRef.current; if (!el) return;
        if (prevPos.current.i !== i) el.scrollTop = 0;
        else if (step > prevPos.current.step) el.scrollTo({ top: el.scrollHeight, behavior: "smooth" });
        prevPos.current = { i, step };
        const t = setTimeout(syncMore, 380);
        return () => clearTimeout(t);
      }, [i, step, syncMore]);

      return (
        <div className="flex-1 min-h-0 flex flex-col gap-2.5">
          {/* 진행바. 슬라이드가 아니라 포인트 기준 */}
          <div className="flex items-center gap-3 shrink-0">
            <div className="flex-1 h-1.5 rounded-full bg-gray-200/70 overflow-hidden">
              <div className={"h-full rounded-full transition-all duration-300 ease-out " + theme.bar}
                   style={{ width: ((doneSteps / totalSteps) * 100).toFixed(1) + "%" }} />
            </div>
            <span className="text-[11px] font-black text-gray-400 tabular-nums shrink-0">{i + 1} / {total}</span>
          </div>

          {/* 덱 - 남은 공간을 채운다 */}
          <div className={"deck-stack rounded-3xl bg-white border shadow-soft flex-1 min-h-0 max-h-[520px] sm:max-h-[640px] overflow-hidden relative " + theme.border}>
            {/* 슬라이드 참조 태그 - {Day}.{슬라이드 순번}-{그 슬라이드 안에서 몇 번째로 열린 문단인지}.
                "Day 8 슬라이드 8.1-2에서 이거 고쳐줘" 처럼 대화로 특정 문단을 정확히 짚을 수 있게 하는
                용도라 늘 떠 있어야 한다 - ?notes=1 뒤에 숨겨뒀더니 안 보인다는 얘기가 나와서 뺐다 */}
            {dayNum != null && (
              <div className="absolute top-2 left-2.5 z-30 pointer-events-none select-none">
                <span className="inline-block rounded-md bg-ink/75 text-white/90 text-[9.5px] font-mono font-bold px-1.5 py-0.5 tracking-wide">
                  {dayNum}.{i + 1}-{step}
                </span>
              </div>
            )}
            {slides.map((s, n) => {
              const active = n === i;
              return (
                <div key={n} aria-hidden={!active}
                  className={active ? (dir > 0 ? "anim-in-r relative z-10 h-full" : "anim-in-l relative z-10 h-full") : "invisible pointer-events-none h-full"}>
                  <SlideBody slide={s} name={name} theme={theme}
                    reveal={active ? step : stepsOf(s, name)}
                    innerRef={active ? scrollRef : null} onScroll={active ? syncMore : null}
                    active={active} />
                </div>
              );
            })}
            {more && (
              <div className="absolute inset-x-0 bottom-0 z-20 pointer-events-none flex justify-center items-end pb-2 h-14 bg-gradient-to-t from-white via-white/80 to-transparent">
                <span className="text-[10px] font-black text-gray-400 animate-floaty">↓ 아래로 더 있어요</span>
              </div>
            )}
          </div>

          {/* 컨트롤. 좌우 화살표 사이에 도트를 가운데 배치 */}
          <div className="shrink-0 flex items-center justify-center gap-4">
            <button onClick={prev} disabled={i === 0 && step === 1}
              className="w-9 h-9 rounded-full border border-gray-200 bg-white grid place-items-center text-gray-400 disabled:opacity-25 hover:bg-brand-50 transition">‹</button>
            <div className="flex items-center gap-1.5 flex-wrap justify-center max-w-[60%]">
              {slides.map((_, n) => (
                <button key={n} onClick={() => jump(n)} aria-label={"슬라이드 " + (n + 1)}
                  className={"h-2 rounded-full transition-all duration-300 " + (n === i ? "w-6 " + theme.bar : n < i ? "w-2 bg-gray-300" : "w-2 bg-brand-100")} />
              ))}
            </div>
            <button onClick={next} disabled={finished}
              className="w-9 h-9 rounded-full border border-gray-200 bg-white grid place-items-center text-gray-400 disabled:opacity-25 hover:bg-brand-50 transition">›</button>
          </div>

          {/* CTA 자리. 높이를 항상 차지해 레이아웃이 흔들리지 않게 한다 */}
          <div className="shrink-0 h-[52px] flex items-center">
            {finished ? (
              <ThemedCTA theme={theme} onClick={onFinish} extra="animate-fadeUp">{finishLabel} →</ThemedCTA>
            ) : (
              <p className="w-full text-center text-xs text-gray-400">
                {curSteps - step > 0
                  ? <>이 장에 <b className="text-gray-500">{curSteps - step}개</b> 더 남았어요. <b className="text-gray-500">→</b> 키로 이어서 보세요</>
                  : <>→ 키나 화살표로 다음 장으로 넘어가세요</>}
              </p>
            )}
          </div>
        </div>
      );
    }

    /* 제공 자료 */
    function parseSegments(text) {
      const lines = text.split("\n"); const segs = []; let buf = [], tbl = [];
      const cols = (l) => l.split("/").length;
      const flushText = () => { if (buf.length) { segs.push({ type: "text", text: buf.join("\n") }); buf = []; } };
      const flushTbl = () => {
        if (tbl.length >= 2) segs.push({ type: "table", rows: tbl.map((r) => r.split("/").map((c) => c.trim())) });
        else if (tbl.length) buf = buf.concat(tbl);
        tbl = [];
      };
      lines.forEach((l) => {
        const isRow = l.trim() && !/^━/.test(l.trim()) && (l.match(/\//g) || []).length >= 2;
        if (isRow && (tbl.length === 0 || cols(l) === cols(tbl[0]))) { flushText(); tbl.push(l); }
        else { flushTbl(); buf.push(l); }
      });
      flushTbl(); flushText();
      return segs;
    }
    const COL_LETTER = (n) => String.fromCharCode(65 + n);
    const slug = (s) => strip(s).replace(/[\\/:*?"<>|]/g, "").replace(/\s*\(.*?\)\s*/g, "").trim().replace(/\s+/g, "-").slice(0, 40) || "자료";

    function SheetTable({ rows, label }) {
      const header = rows[0], body = rows.slice(1);
      const tsv = rows.map((r) => r.join("\t")).join("\n");
      const csv = rows.map((r) => r.map((c) => (/[",]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c)).join(",")).join("\n");
      const file = slug(label);
      return (
        <div className="rounded-2xl border border-gray-300 bg-white overflow-hidden shadow-soft">
          <div className="flex items-center gap-2 px-3 py-2 bg-emerald-700 text-white">
            <span className="text-base">📊</span>
            <span className="text-xs font-bold flex-1 truncate">{file}.csv</span>
            <button onClick={() => copyText(tsv)} title="엑셀·구글시트에 그대로 붙여넣을 수 있어요"
              className="shrink-0 rounded-md bg-white/15 hover:bg-white/25 px-2.5 py-1 text-[11px] font-bold transition">표 복사</button>
            <button onClick={() => downloadBlob(file + ".csv", csv, "text/csv")}
              className="shrink-0 rounded-md bg-white text-emerald-700 hover:bg-emerald-50 px-2.5 py-1 text-[11px] font-black transition">⬇ 엑셀로 받기</button>
          </div>
          <div className="overflow-x-auto">
            <table className="w-full border-collapse text-[13px] tabular-nums">
              <thead>
                <tr>
                  <th className="w-9 bg-gray-100 border border-gray-300 text-[10px] font-normal text-gray-400"></th>
                  {header.map((_, n) => (
                    <th key={n} className="bg-gray-100 border border-gray-300 px-3 py-1 text-[10px] font-normal text-gray-400">{COL_LETTER(n)}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td className="bg-gray-100 border border-gray-300 text-center text-[10px] text-gray-400">1</td>
                  {header.map((c, n) => (
                    <td key={n} className="border border-gray-300 bg-emerald-50 px-3 py-1.5 font-black text-gray-700 whitespace-nowrap">{c}</td>
                  ))}
                </tr>
                {body.map((r, i) => (
                  <tr key={i} className="hover:bg-emerald-50/40 transition-colors">
                    <td className="bg-gray-100 border border-gray-300 text-center text-[10px] text-gray-400">{i + 2}</td>
                    {r.map((c, n) => (
                      <td key={n} className={"border border-gray-300 px-3 py-1.5 whitespace-nowrap " + (n === 0 ? "text-gray-700 font-semibold" : "text-gray-600")}>{c}</td>
                    ))}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="px-3 py-1.5 bg-gray-50 border-t border-gray-200 text-[10px] text-gray-400">
            {body.length}행 × {header.length}열 · <b className="text-gray-500">표 복사</b>를 누르면 엑셀·구글시트에 셀 그대로 붙여넣어져요
          </div>
        </div>
      );
    }

    function PromptCard({ text, name }) {
      const raw = strip(fill(text, name));
      return (
        <div className="rounded-2xl border border-gray-200 bg-gray-50 overflow-hidden">
          <div className="flex items-center gap-2 px-3 py-1.5 bg-gray-100 border-b border-gray-200">
            <span className="text-xs">💬</span>
            <span className="text-[11px] font-bold text-gray-500 flex-1">프롬프트</span>
            <button onClick={() => copyText(raw)} className="shrink-0 rounded-md bg-white border border-gray-300 px-2.5 py-0.5 text-[11px] font-bold text-gray-600 hover:bg-gray-50 transition">복사</button>
          </div>
          <pre className="p-4 text-[13px] text-gray-700 leading-relaxed whitespace-pre-wrap font-sans rich"
               dangerouslySetInnerHTML={{ __html: fill(text, name) }} />
        </div>
      );
    }

    function ResourceBlock({ given, name }) {
      const segs = useMemo(() => parseSegments(fill(given.text, name)), [given.text, name]);
      const whole = strip(fill(given.text, name));
      return (
        <div className="rounded-3xl bg-white border border-gray-200 p-5 shadow-soft">
          <div className="flex items-center gap-2 mb-3">
            <span className="text-lg">📎</span>
            <span className="text-sm font-black text-ink flex-1"><RichInline text={given.label} name={name} /></span>
            <button onClick={() => copyText(whole)} className="shrink-0 rounded-lg border border-gray-300 bg-white px-2.5 py-1 text-[11px] font-bold text-gray-500 hover:bg-gray-50 transition">전체 복사</button>
          </div>
          <div className="space-y-3">
            {segs.map((s, i) => s.type === "table"
              ? <SheetTable key={i} rows={s.rows} label={given.label} />
              : <PromptCard key={i} text={s.text} name={name} />)}
          </div>
        </div>
      );
    }

    /* ═══ 퀴즈 ═══════════════════════════════════════════════════
       한 문제라도 틀리면 처음부터 다시. 고른 답은 변경할 수 없고,
       틀렸을 때 왜 아닌지만 알려주며 정답은 끝까지 감춘다.
    ═══════════════════════════════════════════════════════════ */
    const QUIZ_CAP = 10;
    const QUIZ_PASS_RATIO = 0.7;

    function QuizRunner({ quiz: fullQuiz, theme, name, onPass, onBackToSlides }) {
      const quiz = useMemo(() => fullQuiz.slice(0, QUIZ_CAP), [fullQuiz]);
      const total = quiz.length;
      const passMark = Math.ceil(total * QUIZ_PASS_RATIO);

      const [i, setI] = useState(0);
      const [picked, setPicked] = useState(null);
      const [answers, setAnswers] = useState(() => Array(total).fill(null));
      const [attempt, setAttempt] = useState(1);
      const [phase, setPhase] = useState("quiz"); // quiz | result

      const q = quiz[i];
      const last = i === total - 1;

      const pick = (n) => { if (picked !== null) return; setPicked(n); };
      const next = () => {
        const a = answers.slice(); a[i] = picked;
        setAnswers(a);
        if (last) setPhase("result");
        else { setI(i + 1); setPicked(null); }
      };
      const restart = () => {
        setI(0); setPicked(null); setAnswers(Array(total).fill(null)); setPhase("quiz"); setAttempt((n) => n + 1);
      };

      if (phase === "result") {
        const score = answers.reduce((acc, a, n) => acc + (a === quiz[n].answer ? 1 : 0), 0);
        const pct = Math.round((score / total) * 100);
        const passed = score >= passMark;
        const wrongOnes = quiz.map((qq, n) => ({ qq, n })).filter(({ qq, n }) => answers[n] !== qq.answer);

        return (
          <div className="rounded-3xl bg-white border shadow-soft p-6 sm:p-8 animate-popIn"
               style={{ borderColor: passed ? "#A7F3D0" : "#FFC9AC" }}>
            <div className="text-center">
              <div className="text-5xl">{passed ? (attempt === 1 ? "🏆" : "🎉") : "😢"}</div>
              <div className="mt-3 text-2xl font-black text-ink">
                {total}문제 중 <span className={passed ? "text-emerald-600" : "text-brand-600"}>{score}개</span> 정답 ({pct}%)
              </div>
              <p className="mt-2 text-sm text-gray-500 leading-relaxed">
                {passed
                  ? <>70% 기준(<b className="text-ink">{passMark}개</b>)을 넘었어요.{attempt > 1 && <> <b className="text-ink">{attempt}번째 시도</b>에 통과하셨어요.</>} 오늘 내용을 확실히 잡으셨네요 😊</>
                  : <>통과하려면 <b className="text-ink">{passMark}개 이상</b>(70%)이 필요해요. 아래에서 틀린 문제를 확인하고 다시 풀어보세요.</>}
              </p>
            </div>

            {wrongOnes.length > 0 && (
              <div className="mt-6 space-y-3">
                <div className="text-xs font-black text-gray-400">틀린 문제 {wrongOnes.length}개 다시 보기</div>
                {wrongOnes.map(({ qq, n }) => (
                  <div key={n} className="rounded-2xl border border-amber-200 bg-amber-50 p-4 text-left">
                    <div className="font-black text-sm text-amber-700">{n + 1}번 문제</div>
                    <p className="mt-1 text-sm text-ink font-bold leading-relaxed"><RichInline text={qq.q} name={name} /></p>
                    <p className="mt-2 text-sm text-gray-600 leading-relaxed">
                      내가 고른 답: <b className="text-red-500">{answers[n] == null ? "(선택 안 함)" : strip(fill(qq.choices[answers[n]], name))}</b>
                    </p>
                    <p className="mt-1 text-sm text-gray-600 leading-relaxed">
                      정답: <b className="text-emerald-600">{strip(fill(qq.choices[qq.answer], name))}</b>
                    </p>
                    <p className="mt-2 text-sm text-gray-700 leading-relaxed rich"
                       dangerouslySetInnerHTML={{ __html: fill(qq.explain, name) }} />
                  </div>
                ))}
              </div>
            )}

            <div className="mt-6 flex flex-col sm:flex-row gap-2.5">
              {!passed && onBackToSlides && (
                <button onClick={onBackToSlides} className="rounded-2xl border border-gray-200 bg-white px-5 py-3.5 text-sm font-bold text-gray-500 hover:bg-gray-50 transition sm:shrink-0">
                  ‹ 슬라이드 다시 보기
                </button>
              )}
              {passed ? (
                <ThemedCTA theme={theme} onClick={onPass} layout="flex1">확인하고 완료하기 →</ThemedCTA>
              ) : (
                <ThemedCTA theme={theme} onClick={restart} layout="flex1">1번 문제부터 다시 풀기 ({attempt + 1}번째 시도)</ThemedCTA>
              )}
            </div>
          </div>
        );
      }

      return (
        <div className={"rounded-3xl bg-white border shadow-soft p-6 sm:p-8 " + theme.border}>
          <div className="flex items-center justify-between gap-3">
            <span className={"inline-flex rounded-full px-3 py-1 text-xs font-black " + theme.badge}>❓ 확인 퀴즈</span>
            <div className="flex items-center gap-2 text-xs font-bold text-gray-400 tabular-nums">
              {attempt > 1 && <span className="rounded-full bg-gray-100 border border-gray-200 px-2 py-0.5 text-[10px]">{attempt}번째 시도</span>}
              <span>문제 {i + 1} / {total}</span>
            </div>
          </div>
          <p className="mt-1 text-[11px] text-gray-400">10문제 중 7개(70%) 이상 맞히면 통과예요</p>
          <div className="mt-3 h-1.5 rounded-full bg-gray-200/70 overflow-hidden">
            <div className={"h-full rounded-full transition-all duration-500 " + theme.bar}
                 style={{ width: (((i + (picked !== null ? 1 : 0)) / total) * 100).toFixed(1) + "%" }} />
          </div>

          <div key={i} className="anim-in-r">
            <p className="mt-5 text-lg font-black text-ink leading-snug"><RichInline text={q.q} name={name} /></p>
            <p className="mt-1.5 text-xs text-gray-400">한 번 고르면 바꿀 수 없어요. 신중하게 골라주세요</p>
            <div className="mt-4 space-y-2.5">
              {q.choices.map((c, n) => {
                const isPick = n === picked;
                const cls = isPick ? "bg-emerald-50 border-emerald-300 text-emerald-800 font-bold"
                          : picked !== null ? "bg-gray-50 border-gray-100 text-gray-400"
                          : "bg-white border-gray-200 hover:border-gray-400 hover:bg-gray-50 text-ink";
                return (
                  <button key={n} onClick={() => pick(n)} disabled={picked !== null}
                    className={"w-full text-left rounded-2xl border p-4 text-sm transition flex items-start gap-3 " + cls}>
                    <span className={"shrink-0 w-5 h-5 rounded-full grid place-items-center text-[11px] font-black " + (isPick ? "bg-emerald-500 text-white" : "bg-gray-100 text-gray-500")}>
                      {isPick ? "✓" : String.fromCharCode(65 + n)}
                    </span>
                    <span dangerouslySetInnerHTML={{ __html: fill(c, name) }} />
                  </button>
                );
              })}
            </div>
            {picked !== null && (
              <button onClick={next} className="mt-5 w-full inline-flex justify-center rounded-2xl bg-ink text-white py-3.5 text-sm font-bold hover:bg-gray-800 transition animate-popIn">
                {last ? "결과 보기 →" : "다음 문제 →"}
              </button>
            )}
          </div>
        </div>
      );
    }

    /* 미션 */
    function MissionPanel({ mission, theme, name, checked, setChecked, vals, setVals, onNext, ready }) {
      const toggle = (i) => setChecked(checked.map((v, n) => (n === i ? !v : v)));
      const setVal = (i, v) => setVals(vals.map((x, n) => (n === i ? v : x)));
      return (
        <div className="space-y-5">
          <div className={"rounded-3xl border p-6 shadow-soft " + theme.bg + " " + theme.border}>
            <span className={"inline-flex rounded-full px-3 py-1 text-xs font-black " + theme.chip}>🎯 오늘의 미션</span>
            <h3 className="mt-3 text-xl font-black text-ink leading-snug"><RichInline text={mission.title} name={name} /></h3>
            <p className={"mt-2 text-sm leading-relaxed " + theme.text}><RichInline text={mission.goal} name={name} /></p>
          </div>

          {(() => {
            const stepsBlock = (
              <div className="rounded-3xl bg-white border border-gray-200 p-6 shadow-soft h-full">
                <div className="font-black text-ink mb-4 flex items-center gap-2"><span className="text-lg">📋</span> 이렇게 진행해요</div>
                <ol className="space-y-2.5">
                  {mission.steps.map((t, i) => (
                    <li key={i} className="flex items-start gap-3">
                      <span className={"shrink-0 w-6 h-6 rounded-full grid place-items-center text-[11px] font-black text-white " + theme.solid}>{i + 1}</span>
                      <span className="text-sm text-gray-700 leading-relaxed pt-0.5 rich" dangerouslySetInnerHTML={{ __html: fill(t, name) }} />
                    </li>
                  ))}
                </ol>
              </div>
            );
            /* 자료(미션 프롬프트)와 진행 순서를 나란히 - 스플릿스크린처럼 세로는 좁고 가로는 남는 화면에서
               둘 다 세로로 쌓으면 스크롤만 길어진다. 자료가 없는 미션은 순서만 통짜로 보여준다 */
            return mission.given ? (
              <div className="grid gap-5 items-start grid-cols-[repeat(auto-fit,minmax(260px,1fr))]">
                <ResourceBlock given={mission.given} name={name} />
                {stepsBlock}
              </div>
            ) : stepsBlock;
          })()}

          {mission.fields && mission.fields.length > 0 && (
            <div className="rounded-3xl bg-white border border-gray-200 p-6 shadow-soft space-y-4">
              <div className="font-black text-ink flex items-center gap-2"><span className="text-lg">✍️</span> 답변 작성</div>
              {mission.fields.map((f, i) => (
                <div key={i}>
                  <label className="block text-sm font-bold text-ink mb-1.5">
                    <span className={theme.textSoft}>{f.n}</span> <RichInline text={f.label} name={name} />
                  </label>
                  <textarea rows={3} value={vals[i]} onChange={(e) => setVal(i, e.target.value)} placeholder={fill(f.ph, name)}
                    className={"w-full rounded-xl border border-gray-200 p-3.5 text-sm leading-relaxed resize-y outline-none transition focus:ring-2 " + theme.ring} />
                </div>
              ))}
            </div>
          )}

          <div className="rounded-3xl bg-white border border-gray-200 p-6 shadow-soft">
            <div className="font-black text-ink mb-1 flex items-center gap-2"><span className="text-lg">✅</span> 통과 기준</div>
            <p className="text-xs text-gray-400 mb-4">기준을 채우지 않은 제출은 완료로 인정되지 않아요.</p>
            <div className="space-y-2">
              {mission.checklist.map((t, i) => (
                <label key={i} className={"flex items-start gap-3 rounded-xl border p-3.5 cursor-pointer transition " +
                  (checked[i] ? theme.bg + " " + theme.border : "border-gray-100 hover:bg-gray-50")}>
                  <input type="checkbox" checked={checked[i]} onChange={() => toggle(i)} className="mt-0.5 w-4 h-4 accent-orange-500 shrink-0" />
                  <span className="text-sm text-gray-700 leading-relaxed rich" dangerouslySetInnerHTML={{ __html: fill(t, name) }} />
                </label>
              ))}
            </div>
          </div>

          {mission.tip && (
            <div className="rounded-2xl bg-white border border-dashed border-gray-300 p-4 flex items-start gap-3">
              <span className="text-lg shrink-0">💡</span>
              <p className="text-sm text-gray-600 leading-relaxed rich" dangerouslySetInnerHTML={{ __html: fill(mission.tip, name) }} />
            </div>
          )}

          <ThemedCTA theme={theme} disabled={!ready} onClick={onNext} size="lg">
            {ready ? "제출하러 가기 →" : !checked.every(Boolean) ? "통과 기준을 모두 확인해 주세요" : "답변을 모두 작성해 주세요"}
          </ThemedCTA>
        </div>
      );
    }

    /* 제출 */
    const fmtSize = (b) => (b < 1024 ? b + " B" : b < 1048576 ? (b / 1024).toFixed(0) + " KB" : (b / 1048576).toFixed(1) + " MB");
    const iconOf = (n) => {
      const e = (n.split(".").pop() || "").toLowerCase();
      if (["png","jpg","jpeg","gif","webp","heic"].indexOf(e) !== -1) return "🖼️";
      if (["csv","xlsx","xls"].indexOf(e) !== -1) return "📊";
      if (e === "pdf") return "📕";
      if (["html","htm"].indexOf(e) !== -1) return "🌐";
      if (e === "zip") return "🗜️";
      return "📄";
    };

    function DropZone({ theme, files, setFiles }) {
      const [over, setOver] = useState(false);
      const inputRef = useRef(null);
      const add = useCallback((list) => {
        const picked = Array.from(list || []);
        if (!picked.length) return;
        const items = picked.map((f) => ({ id: Math.random().toString(36).slice(2), name: f.name, size: f.size, status: "uploading" }));
        setFiles((prev) => prev.concat(items));
        items.forEach((it, n) => setTimeout(() => {
          setFiles((prev) => prev.map((x) => (x.id === it.id ? { ...x, status: "saved" } : x)));
        }, 850 + n * 260));
      }, [setFiles]);

      return (
        <div>
          <div onDragOver={(e) => { e.preventDefault(); setOver(true); }} onDragLeave={() => setOver(false)}
            onDrop={(e) => { e.preventDefault(); setOver(false); add(e.dataTransfer.files); }}
            onClick={() => inputRef.current && inputRef.current.click()}
            className={"rounded-3xl border-2 border-dashed p-10 text-center cursor-pointer transition-all duration-200 " +
              (over ? theme.bg + " " + theme.border + " scale-[1.01]" : "border-gray-300 bg-white hover:bg-gray-50")}>
            <div className={"text-5xl transition-transform " + (over ? "scale-110" : "animate-floaty")}>📥</div>
            <div className="mt-4 text-lg font-black text-ink">{over ? "여기에 놓으세요!" : "파일을 여기로 끌어다 놓으세요"}</div>
            <p className="mt-1.5 text-sm text-gray-400">또는 클릭해서 파일 선택 · 여러 개 한 번에 올려도 돼요</p>
            <input ref={inputRef} type="file" multiple className="hidden" onChange={(e) => { add(e.target.files); e.target.value = ""; }} />
          </div>
          {files.length > 0 && (
            <div className="mt-4 space-y-2">
              {files.map((f) => (
                <div key={f.id} className={"rounded-2xl border p-3.5 flex items-center gap-3 animate-popIn " +
                  (f.status === "saved" ? "bg-emerald-50 border-emerald-200" : "bg-white border-gray-200")}>
                  <span className="text-2xl shrink-0">{iconOf(f.name)}</span>
                  <div className="flex-1 min-w-0">
                    <div className="text-sm font-bold text-ink truncate">{f.name}</div>
                    {f.status === "uploading"
                      ? <div className="mt-1.5 h-1.5 rounded-full bg-gray-200 overflow-hidden">
                          <div className={"h-full rounded-full " + theme.bar} style={{ animation: "bar .85s ease-out forwards" }} />
                        </div>
                      : <div className="text-xs text-emerald-600 font-bold mt-0.5">✅ 저장되었습니다 · {fmtSize(f.size)}</div>}
                  </div>
                  {f.status === "saved" && (
                    <button onClick={(e) => { e.stopPropagation(); setFiles((p) => p.filter((x) => x.id !== f.id)); }}
                      className="shrink-0 w-7 h-7 rounded-full bg-white border border-gray-200 text-gray-400 hover:text-red-500 hover:border-red-200 transition text-xs">✕</button>
                  )}
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function SubmitPanel({ mission, theme, name, files, setFiles, submitted, onSubmit, onBack }) {
      const saved = files.filter((f) => f.status === "saved");
      const uploading = files.some((f) => f.status === "uploading");
      const ready = saved.length > 0 && !uploading;

      if (submitted) {
        return (
          <div className="rounded-3xl bg-white border border-emerald-200 p-10 text-center shadow-soft animate-popIn">
            <div className="text-6xl">🎉</div>
            <div className="mt-4 text-2xl font-black text-ink">제출 완료!</div>
            <p className="mt-2.5 text-sm text-gray-500">오늘 Day 완료예요. 파일 <b className="text-ink">{saved.length}개</b>가 저장됐어요.</p>
            <div className="mt-5 inline-flex flex-col gap-1.5">
              {saved.map((f) => (
                <div key={f.id} className="rounded-xl bg-emerald-50 border border-emerald-200 px-4 py-2 text-sm text-emerald-700 font-bold">
                  {iconOf(f.name)} {f.name}
                </div>
              ))}
            </div>
          </div>
        );
      }
      return (
        <div className="space-y-5">
          <div className={"rounded-3xl border p-6 shadow-soft " + theme.bg + " " + theme.border}>
            <div className={"font-black mb-3 flex items-center gap-2 " + theme.text}><span className="text-lg">📤</span> 무엇을 제출하나요</div>
            <dl className="space-y-2 text-sm">
              <div className="flex gap-3"><dt className="w-16 shrink-0 font-bold text-gray-500">무엇을</dt><dd className="text-ink font-semibold">{fill(mission.submit.what, name)}</dd></div>
              <div className="flex gap-3"><dt className="w-16 shrink-0 font-bold text-gray-500">형식</dt><dd className="text-gray-700">{fill(mission.submit.format, name)}</dd></div>
              <div className="flex gap-3"><dt className="w-16 shrink-0 font-bold text-gray-500">상세</dt><dd className="text-gray-700 leading-relaxed">{fill(mission.submit.detail, name)}</dd></div>
            </dl>
          </div>
          <DropZone theme={theme} files={files} setFiles={setFiles} />
          <div className="flex gap-3">
            <button onClick={onBack} className="rounded-2xl border border-gray-200 bg-white px-5 py-4 text-sm font-bold text-gray-500 hover:bg-gray-50 transition shrink-0">‹ 미션</button>
            <ThemedCTA theme={theme} disabled={!ready} onClick={onSubmit} size="lg" layout="flex1">
              {uploading ? "저장 중…" : ready ? "제출하기" : "파일을 올려주세요"}
            </ThemedCTA>
          </div>
        </div>
      );
    }

    /* Day 이전/다음 + 규칙·환급 링크. 학습 화면(compact)과 그 외 화면에서 공통으로 쓴다. */
    function DayFooterNav({ prev, next, compact }) {
      const btnCls = compact
        ? "rounded-lg border border-gray-200 bg-white px-3 py-1.5 font-bold text-gray-500 disabled:opacity-30 hover:bg-brand-50 transition"
        : "rounded-xl border border-gray-200 bg-white px-4 py-2.5 text-sm font-bold text-ink disabled:opacity-30 hover:bg-brand-50 transition";
      return (
        <div className={"shrink-0 flex items-center justify-between gap-3 " + (compact ? "text-xs" : "")}>
          <button disabled={!prev} onClick={() => prev && go("#/day/" + prev.day)} className={btnCls}>
            ‹ {prev ? "Day " + prev.day : "처음"}
          </button>
          <div className={"flex gap-2.5 text-gray-400 " + (compact ? "" : "text-sm gap-3")}>
            <button onClick={() => go("#/rules")} className={"hover:text-ink transition " + (compact ? "font-bold" : "")}>규칙</button>
            <span className={compact ? "text-gray-300" : ""}>·</span>
            <button onClick={() => go("#/refund")} className={"hover:text-ink transition " + (compact ? "font-bold" : "")}>환급</button>
          </div>
          <button disabled={!next} onClick={() => next && go("#/day/" + next.day)} className={btnCls}>
            {next ? "Day " + next.day : "여기까지"} ›
          </button>
        </div>
      );
    }

    /* ═══ Day 화면 ═══════════════════════════════════════════════
       학습 단계는 뷰포트에 맞춰 페이지 스크롤 없이,
       미션·제출 단계는 내용이 길어 일반 스크롤을 쓴다.
    ═══════════════════════════════════════════════════════════ */
    function DayScreen({ dayNum }) {
      const { name, complete, isDone, openName } = useUI();
      const meta = DATA.days.find((d) => d.day === dayNum);
      const idx = DATA.days.findIndex((d) => d.day === dayNum);
      const prev = DATA.days[idx - 1], next = DATA.days[idx + 1];
      const content = DATA.authored[dayNum];
      const theme = THEME[meta.type];
      const isConcept = meta.type === "concept";
      const mission = content.mission;

      const [stage, setStage] = useState("learn");
      const [submitted, setSubmitted] = useState(() => isDone(dayNum));
      const [checked, setChecked] = useState(() => (mission ? mission.checklist.map(() => false) : []));
      const [vals, setVals] = useState(() => (mission && mission.fields ? mission.fields.map(() => "") : []));
      const [files, setFiles] = useState([]);
      const [hintOff, setHintOff] = useState(false);
      const [noteOpen, setNoteOpen] = useState(false);
      const [noteTick, setNoteTick] = useState(0);
      const hasNote = useMemo(() => (loadLS(noteKey(dayNum), "") || "").trim().length > 0, [dayNum, noteOpen, noteTick]);

      const split = useSplitScreen();
      const showHint = !isConcept && !split && !hintOff && !submitted;

      useEffect(() => {
        setStage("learn"); setSubmitted(isDone(dayNum)); setFiles([]); setHintOff(false); setNoteOpen(false);
        setChecked(mission ? mission.checklist.map(() => false) : []);
        setVals(mission && mission.fields ? mission.fields.map(() => "") : []);
      }, [dayNum]);

      /* ↑ 다음 Day · ↓ 이전 Day. 좌우 화살표는 슬라이드 안 이동에 이미 쓰이고 있어서 위아래로 분리했다 */
      useEffect(() => {
        const on = (e) => {
          if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
          if (e.key === "ArrowUp") { if (next) { e.preventDefault(); go("#/day/" + next.day); } }
          else if (e.key === "ArrowDown") { if (prev) { e.preventDefault(); go("#/day/" + prev.day); } }
        };
        window.addEventListener("keydown", on);
        return () => window.removeEventListener("keydown", on);
      }, [prev, next]);

      const missionReady = checked.length > 0 && checked.every(Boolean) && vals.every((v) => v.trim().length > 0);
      const stages = isConcept
        ? [{ key: "learn", n: "①", label: "학습" }, { key: "act", n: "②", label: "퀴즈" }]
        : [{ key: "learn", n: "①", label: "학습" }, { key: "act", n: "②", label: "미션" }, { key: "submit", n: "③", label: "제출" }];
      const stageIdx = stages.findIndex((s) => s.key === stage);
      const learnMode = stage === "learn";

      const badge = (
        <>
          <span className={"rounded-full px-2.5 py-1 text-xs font-bold " + theme.badge}>{theme.emoji} {theme.label}</span>
          <span className="text-sm font-black text-gray-500 whitespace-nowrap tabular-nums">Day {dayNum} / {DATA.product.totalDays}</span>
        </>
      );
      const onPass = () => { complete(dayNum); showToast("Day " + dayNum + " 완료 ✅"); };
      const onSubmit = () => { setSubmitted(true); complete(dayNum); showToast("제출 완료! 🔥"); };

      const StageChips = ({ compact }) => (
        <div className={"flex items-center gap-1.5 " + (compact ? "" : "flex-1")}>
          {stages.map((st, i) => {
            const active = i === stageIdx, passed = i < stageIdx;
            const reachable = i <= 1 || (i === 2 && missionReady) || i <= stageIdx;
            return (
              <React.Fragment key={st.key}>
                {i > 0 && <div className={"h-0.5 rounded transition-all duration-500 " + (compact ? "w-3" : "flex-1") + " " + (i <= stageIdx ? theme.bar : "bg-gray-200")} />}
                <button onClick={() => reachable && setStage(st.key)} disabled={!reachable}
                  className={"flex items-center gap-1 rounded-full px-2.5 py-1 text-[11px] font-black transition whitespace-nowrap border " +
                    (active ? theme.chip + " border-transparent"
                      : passed ? "bg-white " + theme.border + " " + theme.text
                      : reachable ? "bg-white border-gray-200 text-gray-400 hover:text-gray-600"
                      : "bg-white border-gray-200 text-gray-300 cursor-not-allowed")}>
                  <span>{passed ? "✓" : st.n}</span> {st.label}
                </button>
              </React.Fragment>
            );
          })}
        </div>
      );

      const NameBtn = () => (
        <button onClick={openName} title="내 이름 설정"
          className="shrink-0 rounded-full px-2.5 py-1 text-[11px] font-bold border bg-white text-gray-400 border-gray-200 hover:text-gray-600 transition">🦁</button>
      );

      const NoteBtn = () => (
        <button onClick={() => setNoteOpen((v) => !v)} title="내 노트. 자동 저장되고 .txt 로 내려받을 수 있어요"
          className={"relative shrink-0 rounded-full px-2.5 py-1 text-[11px] font-bold border transition " +
            (noteOpen ? "bg-ink text-white border-ink" : "bg-white text-gray-400 border-gray-200 hover:text-gray-600")}>
          📝 노트
          {hasNote && !noteOpen && <span className="absolute -top-0.5 -right-0.5 w-2 h-2 rounded-full bg-brand-500 ring-2 ring-cream" />}
        </button>
      );

      const overlays = (
        <>
          {showHint && <SplitScreenHint onDismiss={() => setHintOff(true)} />}
          {noteOpen && <NotePanel day={dayNum} meta={meta} onClose={() => { setNoteOpen(false); setNoteTick((t) => t + 1); }} />}
        </>
      );

      if (learnMode) {
        return (
          <div className="h-[100svh] flex flex-col bg-cream text-ink overflow-hidden">
            {overlays}
            <div className={"flex flex-col h-full " + (showHint ? "lg:pr-[38vw]" : "")}>
              <TopHeader subtitle={meta.chapter + " · " + meta.chapterTitle} badge={badge} progress={dayNum / DATA.product.totalDays} />
              {/* 학습 화면은 뷰포트에 꽉 맞춘다. 목차는 헤더의 "전체 목차" 링크로 항상 열 수 있어서
                  여기서는 따로 뜨는 FAB 을 두지 않고, 그만큼 카드에 높이를 돌려준다. */}
              <main className={"flex-1 min-h-0 w-full max-w-4xl mx-auto px-4 pt-3 flex flex-col gap-2.5 " +
                (showHint ? "pb-[112px] lg:pb-2.5" : "pb-2.5")}>
                <div className="shrink-0 flex items-center gap-2.5">
                  {meta.milestone && <span className="shrink-0 text-sm">🚩</span>}
                  <h1 className="text-[15px] font-black truncate flex-1 min-w-0">{meta.name}</h1>
                  <StageChips compact />
                  <NameBtn />
                  <NoteBtn />
                </div>
                <SlideDeck key={"deck-" + dayNum} slides={content.slides} theme={theme} name={name} dayNum={dayNum}
                  finishLabel={isConcept ? "퀴즈 풀기" : "미션 확인"} onFinish={() => setStage("act")} />
                <DayFooterNav prev={prev} next={next} compact />
              </main>
            </div>
          </div>
        );
      }

      return (
        <div className={"bg-cream min-h-screen text-ink " + (showHint ? "pb-[264px] lg:pb-36" : "pb-36")}>
          {overlays}
          <Fabs liftForHint={showHint} />
          <div className={showHint ? "lg:pr-[38vw]" : ""}>
            <TopHeader subtitle={meta.chapter + " · " + meta.chapterTitle} badge={badge} progress={dayNum / DATA.product.totalDays} />
            <div className="max-w-4xl mx-auto px-4 py-6">
              <div className="animate-fadeUp">
                {meta.milestone && (
                  <span className="inline-flex items-center gap-1.5 rounded-full bg-ink text-white px-3 py-1.5 text-xs font-black mb-3 sheen">🚩 프로젝트</span>
                )}
                <h1 className="text-2xl font-black leading-snug">{meta.name}</h1>
                <p className="mt-1.5 text-sm text-gray-500 leading-relaxed">이 챕터가 끝나면, <b className="text-ink">{meta.chapterOutcome}</b></p>
              </div>

              <div className="mt-5 flex items-center gap-2">
                <StageChips />
                <NoteBtn />
              </div>

              <div className="mt-5 animate-fadeUp">
                {stage === "act" && (isConcept
                  ? <QuizRunner key={"quiz-" + dayNum} quiz={content.quiz} theme={theme} name={name} onPass={onPass}
                      onBackToSlides={() => setStage("learn")} />
                  : <MissionPanel mission={mission} theme={theme} name={name}
                      checked={checked} setChecked={setChecked} vals={vals} setVals={setVals}
                      ready={missionReady} onNext={() => { setStage("submit"); window.scrollTo({ top: 0, behavior: "smooth" }); }} />)}
                {stage === "submit" && (
                  <SubmitPanel mission={mission} theme={theme} name={name} files={files} setFiles={setFiles}
                    submitted={submitted} onSubmit={onSubmit} onBack={() => setStage("act")} />
                )}
                <button onClick={() => setStage("learn")}
                  className="mt-5 w-full rounded-xl border border-gray-200 bg-white py-3 text-sm font-bold text-gray-500 hover:bg-gray-50 transition">‹ 슬라이드 다시 보기</button>
              </div>

              <div className="mt-10 border-t border-brand-100 pt-6">
                <DayFooterNav prev={prev} next={next} />
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* 규칙 / 환급 */
    function InfoPage({ kind }) {
      const rules = kind === "rules";
      const R = rules ? DATA.rules : DATA.refund;
      return (
        <div className="bg-cream min-h-screen text-ink">
          <Fabs />
          <TopHeader subtitle={rules ? "규칙 안내" : "환급 안내"} />
          <div className="max-w-2xl mx-auto px-4 py-10">
            <div className="text-center animate-fadeUp">
              <span className="inline-block rounded-full bg-brand-50 text-brand-600 border border-brand-100 px-3.5 py-1.5 text-sm font-bold">
                {rules ? "📖 규칙 안내" : "💸 환급 안내"}
              </span>
              <h1 className="mt-4 text-3xl font-black">{R.title}</h1>
              <p className="mt-2 text-gray-500">{R.subtitle}</p>
            </div>

            {!rules && (
              <div className="mt-8 rounded-3xl bg-white border border-brand-100 p-8 shadow-soft flex items-center justify-center gap-4 sm:gap-6 animate-popIn">
                <span className="text-3xl sm:text-5xl font-black text-gray-300 line-through decoration-4">{R.before}</span>
                <span className="text-2xl sm:text-3xl text-brand-400">→</span>
                <span className="text-3xl sm:text-5xl font-black text-brand-500">{R.after}</span>
              </div>
            )}

            <div className="mt-8 space-y-3 stagger">
              {(rules ? R.items : R.conditions).map((it, i) => (
                <div key={i} className="rounded-2xl bg-white border border-brand-100 p-5 shadow-soft flex gap-4">
                  <div className="text-3xl shrink-0">{it.icon}</div>
                  <div>
                    <div className="font-black text-ink">{it.title}</div>
                    <p className="mt-1 text-sm text-gray-500 leading-relaxed">{it.desc}</p>
                  </div>
                </div>
              ))}
            </div>

            {rules ? (
              <div className="mt-10">
                <div className="text-center text-sm font-black text-gray-400">⚠️ 코스 전반 주의사항</div>
                <div className="mt-4 grid sm:grid-cols-3 gap-3">
                  {DATA.notices.map((n, i) => (
                    <div key={i} className="rounded-2xl bg-white border border-gray-200 p-4">
                      <div className="text-2xl">{n.icon}</div>
                      <div className="mt-2 font-black text-sm text-ink">{n.title}</div>
                      <p className="mt-1 text-xs text-gray-500 leading-relaxed">{n.desc}</p>
                    </div>
                  ))}
                </div>
              </div>
            ) : (
              <p className="mt-6 rounded-2xl bg-brand-50 border border-brand-100 p-5 text-sm text-gray-600 leading-relaxed text-center">{R.note}</p>
            )}

            <div className="mt-10 text-center">
              <button onClick={() => go("#/day/1")} className="rounded-2xl bg-brand-500 hover:bg-brand-600 text-white px-6 py-3 font-black transition">Day 1로 가기 →</button>
            </div>
          </div>
        </div>
      );
    }

    /* 라우터 + 루트 */
    function parseRoute(hash) {
      const h = (hash || "#/day/1").replace(/^#/, "");
      if (h.indexOf("/day/") === 0) {
        const n = parseInt(h.split("/")[2], 10);
        return { name: "day", day: DATA.days.some((d) => d.day === n) ? n : 1 };
      }
      if (h.indexOf("/rules") === 0) return { name: "rules" };
      if (h.indexOf("/refund") === 0) return { name: "refund" };
      return { name: "day", day: 1 };
    }

    function NameModal({ onClose }) {
      const { name, setName } = useUI();
      const [v, setV] = useState(name);
      return (
        <div className="fixed inset-0 z-[220] bg-black/50 backdrop-blur-sm grid place-items-center px-4" onClick={onClose}>
          <div className="bg-white rounded-3xl p-7 w-full max-w-sm shadow-lift animate-popIn" onClick={(e) => e.stopPropagation()}>
            <div className="text-lg font-black text-ink">이름을 알려주세요 🦁</div>
            <p className="mt-1.5 text-sm text-gray-500 leading-relaxed">슬라이드 곳곳에서 <b className="text-ink">{"{{name}}"}</b> 자리에 들어갈 이름이에요.</p>
            <input value={v} onChange={(e) => setV(e.target.value)} placeholder="유저"
              className="mt-4 w-full rounded-xl border border-gray-200 px-4 py-3 text-sm outline-none focus:ring-2 ring-brand-300" />
            <button onClick={() => { setName(v.trim() || DATA.DEMO_NAME); onClose(); }}
              className="mt-4 w-full rounded-2xl bg-brand-500 hover:bg-brand-600 text-white py-3 font-black transition">저장하기</button>
          </div>
        </div>
      );
    }

    function App() {
      const route = useHashRoute();
      const r = parseRoute(route);
      const prog = useProgress();
      const [gridOpen, setGridOpen] = useState(false);
      const [nameOpen, setNameOpen] = useState(false);
      const [name, setNameState] = useState(() => loadLS("mjc.name", DATA.DEMO_NAME));
      const tooNarrow = useNarrowGuard();

      const ui = { ...prog, name, setName: (n) => { setNameState(n); saveLS("mjc.name", n); },
                   openGrid: () => setGridOpen(true), openName: () => setNameOpen(true) };

      let page;
      if (r.name === "rules") page = <InfoPage kind="rules" />;
      else if (r.name === "refund") page = <InfoPage kind="refund" />;
      else page = <DayScreen key={r.day} dayNum={r.day} />;

      return (
        <UICtx.Provider value={ui}>
          {page}
          {gridOpen &&<ChapterGrid onPick={(n) => { setGridOpen(false); go("#/day/" + n); }} onClose={() => setGridOpen(false)} currentDay={r.name === "day" ? r.day : null} />}
          {nameOpen && <NameModal onClose={() => setNameOpen(false)} />}
          {tooNarrow && <NarrowScreenGuard />}
        </UICtx.Provider>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
