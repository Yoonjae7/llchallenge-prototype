<body>

  <!-- 커리큘럼 데이터 모델 -->

  <!-- 애플리케이션 -->
  <script type="text/babel" data-presets="react-classic">
    const { useState, useEffect, useMemo } = React;
    const DATA = window.MJC_DATA;

    /* ─────────────────────────────────────────────────────────────
       공용 유틸
    ───────────────────────────────────────────────────────────── */
    function go(hash) {
      window.location.hash = hash;
      window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
    }
    function scrollToId(id) {
      const el = document.getElementById(id);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    }
    function useHashRoute() {
      const [route, setRoute] = useState(window.location.hash || "#/");
      useEffect(() => {
        const on = () => setRoute(window.location.hash || "#/");
        window.addEventListener("hashchange", on);
        return () => window.removeEventListener("hashchange", on);
      }, []);
      return route;
    }
    function showToast(msg) {
      const t = document.createElement("div");
      t.textContent = msg;
      t.className =
        "fixed left-1/2 -translate-x-1/2 bottom-10 z-[200] px-4 py-2.5 rounded-full " +
        "bg-ink text-white text-sm font-medium shadow-lg animate-popIn";
      document.body.appendChild(t);
      setTimeout(() => { t.style.transition = "opacity .3s"; t.style.opacity = "0"; }, 1300);
      setTimeout(() => t.remove(), 1700);
    }
    function copyText(text, label) {
      const done = () => showToast(label || "복사됐어요 ✅");
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
      } else {
        fallbackCopy(text, done);
      }
    }
    function fallbackCopy(text, done) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      ta.remove();
      done();
    }
    const statusOf = (day, cur) => (day < cur ? "done" : day === cur ? "current" : "todo");

    const TYPE_BADGE = {
      concept: "bg-gray-100 text-gray-600 border border-gray-200",
      live:    "bg-brand-500 text-white border border-brand-500",
      cross:   "bg-brand-50 text-brand-600 border border-brand-200",
    };

    /* ─────────────────────────────────────────────────────────────
       공용 프리미티브
    ───────────────────────────────────────────────────────────── */
    function SectionCode({ children }) {
      return (
        <span className="inline-block rounded-full bg-brand-50 text-brand-600 border border-brand-100
                         px-3.5 py-1.5 text-sm font-bold tracking-tight">
          {children}
        </span>
      );
    }
    function CTA({ children, onClick, size = "lg", className = "" }) {
      const sizes = {
        lg: "px-8 py-4 text-lg",
        md: "px-6 py-3 text-base",
      };
      return (
        <button
          onClick={onClick}
          className={
            "inline-flex items-center justify-center gap-2 rounded-2xl font-bold text-white " +
            "bg-brand-500 hover:bg-brand-600 active:scale-[.98] transition shadow-card " +
            sizes[size] + " " + className
          }>
          {children}
        </button>
      );
    }

    function RotatingCurriculumPhrase() {
      const phrases = ["를 제대로 씁니다", "가 인생을 바꿉니다", "가 야근을 없앱니다"];
      const [i, setI] = useState(0);
      useEffect(() => {
        const t = setInterval(() => setI((v) => (v + 1) % phrases.length), 2600);
        return () => clearInterval(t);
      }, []);
      return (
        <span key={i} className="inline-block text-brand-500 animate-fadeUp">{phrases[i]}</span>
      );
    }

    /* ═════════════════════════════════════════════════════════════
       학습 앱 (듀오링고형) · 공유 상태 + 데모 컨트롤
       - 커리큘럼은 숨김: 오늘 것만 보이고, 끝내면 내일을 살짝 예고
       - 시간이 자동으로 Day 를 센다 (시작일 기준)
       - 우하단 데모 독으로 시작일·Day 를 직접 바꿔 그날 컨텐츠를 확인
       ═════════════════════════════════════════════════════════════ */
    const CH = { total: 60, price: 200000, refundRate: 0.5, refundWon: 10 };
    const STORE_KEY = "mjc_demo_v2";
    const dRange = (a, b) => Array.from({ length: Math.max(0, b - a + 1) }, (_, i) => a + i);
    const clampN = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
    const startOfDay = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
    const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
    const daysBetween = (a, b) => Math.round((startOfDay(b) - startOfDay(a)) / 86400000);
    const fmtKDate = (d) => { const x = new Date(d); return `${x.getMonth() + 1}월 ${x.getDate()}일`; };
    const fmtInputDate = (d) => { const x = startOfDay(d); const m = String(x.getMonth() + 1).padStart(2, "0"); const dd = String(x.getDate()).padStart(2, "0"); return `${x.getFullYear()}-${m}-${dd}`; };

    function teaserFor(dayNum) {
      const d = DATA.days.find((x) => x.day === dayNum);
      if (!d) return { theme: "31일차부터", line: "익힌 것을 조합해 진짜 업무를 바꾸는 단계 — 완주하며 열려요." };
      const wk = DATA.weeks.find((w) => w.id === d.week);
      const kind = { concept: "새로운 개념 한 조각", live: "직접 해보는 실전 한 판", cross: "배우고 바로 써먹는 하루" }[d.type];
      return { theme: wk.name, line: `${kind}이 기다려요.` };
    }
    function dayEncourage(n) {
      if (n <= 1) return "오늘부터 시작이에요.";
      if (n <= 5) return `${n}일째 · 아직 워밍업이에요. 편하게 가요.`;
      if (n <= 14) return `${n}일째 · 이 페이스, 정말 좋아요.`;
      if (n <= 29) return `${n}일째 · 이제 손에 익어가죠?`;
      return `${n}일째 · 30일 완주가 코앞이에요!`;
    }
    function missionTemplate(d) {
      return (
        "[역할] 너는 내 업무를 돕는 어시스턴트야.\n" +
        "[오늘 맡길 일] " + d.title.replace(/[“”]/g, "") + "\n" +
        "[가진 자료] (엑셀·PDF·메일 등 붙여넣기 또는 업로드)\n" +
        "[원하는 결과물] " + d.output + "\n" +
        "[형식] 표 / 요약 / 초안 중 택1 — 바로 쓸 수 있게"
      );
    }

    const AppCtx = React.createContext(null);
    const useApp = () => React.useContext(AppCtx);

    function defaultDemoState() {
      // 기본 데모: 오늘이 Day 1 (방금 시작) → 시작일 = 오늘
      // (완주 중 시나리오는 데모 독의 'Day 12' 바로가기로 전환)
      return { startISO: startOfDay(new Date()).toISOString(), broken: [], todayDone: false };
    }
    function loadDemoState() {
      try { const s = JSON.parse(localStorage.getItem(STORE_KEY)); if (s && s.startISO) return { broken: [], todayDone: false, ...s }; } catch (e) {}
      return defaultDemoState();
    }

    function AppProvider({ children }) {
      const [state, setState] = useState(loadDemoState);
      useEffect(() => { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }, [state]);

      const start = startOfDay(new Date(state.startISO));
      const now = startOfDay(new Date());
      const rawDay = daysBetween(start, now) + 1;
      const currentDay = clampN(rawDay, 1, CH.total);
      const notStarted = rawDay < 1;
      const finished = rawDay > CH.total;

      const brokenPast = state.broken.filter((d) => d < currentDay);
      const eligible = brokenPast.length === 0;
      const isDone = (d) => (d < currentDay ? !state.broken.includes(d) : d === currentDay ? state.todayDone : false);
      const completedCount = (currentDay - 1 - brokenPast.length) + (state.todayDone ? 1 : 0);
      let streak = 0;
      { let d = state.todayDone ? currentDay : currentDay - 1; while (d >= 1 && isDone(d)) { streak++; d--; } }

      const actions = {
        setStartDate: (iso) => setState((s) => ({ ...s, startISO: startOfDay(new Date(iso)).toISOString(), todayDone: false })),
        jumpToDay: (n) => setState((s) => ({ ...s, startISO: addDays(startOfDay(new Date()), -(clampN(n, 1, CH.total) - 1)).toISOString(), todayDone: false })),
        advance: () => setState((s) => ({ ...s, startISO: addDays(startOfDay(new Date()), -(clampN(currentDay + 1, 1, CH.total) - 1)).toISOString(), todayDone: false })),
        toggleToday: () => setState((s) => ({ ...s, todayDone: !s.todayDone })),
        setStreakBroken: (on) => setState((s) => {
          const target = Math.max(1, currentDay - 2);
          let broken = s.broken.filter((x) => x !== target);
          if (on) broken = [...broken, target];
          return { ...s, broken };
        }),
        reset: () => setState(defaultDemoState()),
      };

      const value = { state, actions, start, now, rawDay, currentDay, notStarted, finished, eligible, isDone, completedCount, streak };
      return <AppCtx.Provider value={value}>{children}</AppCtx.Provider>;
    }

    /* ── 공용 소품 ─────────────────────────────────────────────── */
    function Ring({ percent, size = 72, stroke = 8, track = "#FFE4D5", color = "#F97316" }) {
      const r = (size - stroke) / 2, c = 2 * Math.PI * r, off = c * (1 - percent / 100);
      return (
        <div className="relative" style={{ width: size, height: size }}>
          <svg width={size} height={size} className="-rotate-90">
            <circle cx={size / 2} cy={size / 2} r={r} stroke={track} strokeWidth={stroke} fill="none" />
            <circle cx={size / 2} cy={size / 2} r={r} stroke={color} strokeWidth={stroke} fill="none" strokeDasharray={c} strokeDashoffset={off} strokeLinecap="round" />
          </svg>
          <div className="absolute inset-0 grid place-items-center text-brand-600 font-black" style={{ fontSize: size / 4 }}>{Math.round(percent)}%</div>
        </div>
      );
    }
    function StreakChip({ streak }) {
      return (
        <span className="inline-flex items-center gap-1 rounded-full bg-brand-50 border border-brand-100 px-3 py-1.5 text-sm font-black text-brand-600">
          🔥 {streak}일
        </span>
      );
    }

    /* ── 학습 앱 헤더 ─────────────────────────────────────────── */

              <img src="likelion-logo.svg" alt="멋쟁이사자처럼" className="h-4 sm:h-5 w-auto" />
            </button>
            <div className="ml-auto flex items-center gap-2">
              <StreakChip streak={streak} />
              <span className="hidden sm:inline text-sm font-bold text-gray-500">Day {currentDay}/60</span>
              <button onClick={() => showToast("💬 캠프파이어 채팅 — 데모에서는 안내만 제공돼요")} className="w-9 h-9 rounded-full bg-white border border-gray-200 grid place-items-center hover:bg-brand-50 transition" title="캠프파이어 채팅">💬</button>
            </div>
          </div>

      );
    }

    /* ── 환급 진행 위젯 (자격 잃으면 바 자체가 사라짐) ────────── */
    function RefundStatus({ compact }) {
      const { eligible, completedCount } = useApp();
      const pct = Math.round((completedCount / CH.total) * 100);
      if (!eligible) {
        return (
          <div className="rounded-2xl bg-gray-50 border border-gray-200 p-4">
            <div className="flex items-center gap-2 font-bold text-gray-500"><span>🌙</span> 환급 진행 바는 잠시 접어뒀어요</div>
            <p className="mt-1 text-sm text-gray-400">스트릭이 끊겨 환급 자격은 마감됐어요. 부담은 내려놓고, 지금부터는 <b className="text-gray-500">학습 그 자체</b>에만 집중하면 돼요.</p>
            <button onClick={() => go("#/refund")} className="mt-2 text-sm font-bold text-brand-600 hover:underline">환급 규칙 다시 보기 →</button>
          </div>
        );
      }
      return (
        <div className={"rounded-2xl bg-white border border-brand-100 " + (compact ? "p-4" : "p-5")}>
          <div className="flex items-center justify-between">
            <span className="font-bold text-ink">완주 환급까지</span>
            <span className="text-sm font-black text-brand-600">{completedCount} / {CH.total}일</span>
          </div>
          <div className="mt-2 h-2.5 rounded-full bg-brand-50 overflow-hidden">
            <div className="h-full bg-brand-500 rounded-full transition-all" style={{ width: pct + "%" }} />
          </div>
          <p className="mt-2 text-sm text-gray-500">끝까지 이어가면 <b className="text-brand-600">10만원</b>을 돌려받아요.</p>
        </div>
      );
    }

    /* ── 듀오링고형 경로 노드 ─────────────────────────────────── */
    function PathNode({ n, state, onClick }) {
      const base = "grid place-items-center rounded-full font-black transition select-none";
      if (state === "done")
        return <button onClick={onClick} className={base + " w-14 h-14 bg-emerald-500 text-white text-xl shadow-soft hover:scale-105"} title={"Day " + n + " · 완료"}>✓</button>;
      if (state === "currentDone")
        return (
          <div className="flex flex-col items-center gap-1">
            <span className="rounded-full bg-brand-500 text-white px-3 py-0.5 text-xs font-black shadow-card">오늘 완료 🔥</span>
            <button onClick={onClick} className={base + " w-20 h-20 bg-brand-500 text-white text-2xl ring-8 ring-brand-100 shadow-card hover:scale-105"}>✓</button>
          </div>
        );
      if (state === "current")
        return (
          <div className="flex flex-col items-center gap-1.5 animate-floaty">
            <span className="rounded-full bg-ink text-white px-3 py-1 text-xs font-black shadow-card">오늘의 미션</span>
            <button onClick={onClick} className={base + " w-20 h-20 bg-brand-500 text-white text-3xl ring-8 ring-brand-100 shadow-card hover:scale-105"}>▶</button>
            <span className="text-xs font-bold text-brand-600">시작하기</span>
          </div>
        );
      // locked
      return <button onClick={onClick} className={base + " w-14 h-14 bg-white border-2 border-gray-200 text-gray-300 text-lg hover:border-brand-200"} title="아직 잠겨 있어요">🔒</button>;
    }

    /* ── 학습 홈 (#/learn) : 여정 경로 ────────────────────────── */
    function LearnHome() {
      const app = useApp();
      const { currentDay, notStarted, finished, streak, start, state } = app;

      if (notStarted) {
        const dleft = 1 - app.rawDay;
        return (
          <div className="bg-cream min-h-screen text-ink">
            <LearnHeader />
            <div className="max-w-3xl mx-auto px-4 py-16 text-center">
              <div className="text-6xl">🗓️</div>
              <h1 className="mt-4 text-3xl font-black">시작을 기다리는 중이에요</h1>
              <p className="mt-3 text-gray-500"><b className="text-ink">{fmtKDate(start)}</b>에 Day 1이 열려요. (D-{dleft})</p>
              <p className="mt-1 text-sm text-gray-400">시작일은 결제 후 한 달 안에서 한 번만 고를 수 있어요.</p>
              <button onClick={() => go("#/rules")} className="mt-6 text-brand-600 font-bold hover:underline">규칙 자세히 보기 →</button>
            </div>
          </div>
        );
      }

      const curWeek = (() => { const d = DATA.days.find((x) => x.day === currentDay); return d ? DATA.weeks.find((w) => w.id === d.week) : null; })();
      const windowStart = Math.max(1, currentDay - 4);
      const peekEnd = Math.min(currentDay + 2, CH.total);
      const nodes = dRange(windowStart, peekEnd);
      const offsets = [0, 62, 92, 62, 0, -62, -92, -62];
      const teaser = teaserFor(currentDay + 1);

      return (
        <div className="bg-cream min-h-screen text-ink pb-28">
          <LearnHeader />
          <div className="max-w-3xl mx-auto px-4 py-6">
            {/* 요약 카드 */}
            <div className="rounded-3xl bg-white border border-brand-100 p-5 shadow-soft flex items-center gap-4">
              <Ring percent={Math.round((currentDay / CH.total) * 100)} size={64} stroke={7} />
              <div className="flex-1 min-w-0">
                <div className="text-xl font-black">Day {currentDay} <span className="text-gray-400 font-bold">/ 60</span></div>
                <div className="mt-0.5 flex items-center gap-2 text-sm">
                  <StreakChip streak={streak} />
                  <span className="text-gray-500">{fmtKDate(start)} 시작</span>
                </div>
              </div>
              <div className="hidden sm:flex gap-2">
                <button onClick={() => go("#/rules")} className="rounded-xl border border-gray-200 bg-white px-3 py-2 text-sm font-bold hover:bg-brand-50">규칙</button>
                <button onClick={() => go("#/refund")} className="rounded-xl border border-gray-200 bg-white px-3 py-2 text-sm font-bold hover:bg-brand-50">환급</button>
              </div>
            </div>

            <div className="mt-4"><RefundStatus /></div>

            {/* 이번 주 배너 (거친 개요만 노출) */}
            {curWeek && (
              <div className="mt-6 rounded-2xl bg-brand-50 border border-brand-100 px-5 py-3 flex items-center gap-3">
                <span className="text-2xl">{curWeek.emoji}</span>
                <div><b className="text-brand-700">이번 여정 · {curWeek.name}</b><div className="text-xs text-gray-500">전체 커리큘럼은 숨겨져 있어요 — 오늘 것에만 집중해요.</div></div>
              </div>
            )}

            {/* 경로 */}
            <div className="mt-4 flex flex-col items-center gap-6 py-4">
              {windowStart > 1 && (
                <div className="rounded-full bg-white border border-brand-100 px-4 py-1.5 text-xs font-bold text-gray-400 shadow-soft">
                  지나온 {windowStart - 1}일 🔥
                </div>
              )}
              {nodes.map((n, i) => {
                const st = n < currentDay ? "done" : n === currentDay ? (state.todayDone ? "currentDone" : "current") : "locked";
                const off = offsets[i % offsets.length];
                const onClick = () => {
                  if (n <= currentDay) go("#/day/" + n);
                  else if (n === currentDay + 1 && state.todayDone) showToast("내일 미리보기는 아래에서 확인해요 👇");
                  else showToast("그날이 되면 열려요 🔒");
                };
                return (
                  <div key={n} style={{ transform: `translateX(${off}px)` }} className="flex flex-col items-center">
                    <PathNode n={n} state={st} onClick={onClick} />
                    {(st === "done" || st === "locked") && <span className="mt-1 text-[11px] text-gray-400 font-semibold">Day {n}</span>}
                  </div>
                );
              })}
              <div className="mt-1 rounded-2xl bg-white border border-dashed border-brand-200 px-5 py-3 text-center text-sm text-gray-400">🔒 그 다음은, 그날 열려요</div>
            </div>

            {/* 오늘 완료 시 내일 미리보기 (완료해야만 살짝 공개) */}
            {state.todayDone && !finished && (
              <div className="mt-2 rounded-2xl bg-gradient-to-br from-brand-500 to-brand-600 text-white p-5 shadow-card">
                <div className="text-sm font-bold text-white/80">🎉 오늘 미션 완료! 내일 미리보기</div>
                <div className="mt-1 text-lg font-black">«{teaser.theme}»</div>
                <div className="text-white/90 text-sm">{teaser.line}</div>
                <button onClick={() => app.actions.advance()} className="mt-3 rounded-xl bg-white text-brand-600 px-4 py-2 font-black hover:bg-brand-50 transition">다음 날 열기 →</button>
              </div>
            )}

    /* ─────────────────────────────────────────────────────────────
       페이지 2 · Course Overview (구 버전 · 현재 라우팅되지 않음)
    ───────────────────────────────────────────────────────────── */
    function ProgressRing({ percent, size = 72, stroke = 8 }) {
      const r = (size - stroke) / 2;
      const c = 2 * Math.PI * r;
      const off = c * (1 - percent / 100);
      return (
        <div className="relative" style={{ width: size, height: size }}>
          <svg width={size} height={size} className="-rotate-90">
            <circle cx={size / 2} cy={size / 2} r={r} stroke="#FFE4D5" strokeWidth={stroke} fill="none" />
            <circle cx={size / 2} cy={size / 2} r={r} stroke="#F97316" strokeWidth={stroke} fill="none"
              strokeDasharray={c} strokeDashoffset={off} strokeLinecap="round" />
          </svg>
          <div className="absolute inset-0 grid place-items-center text-brand-600 font-black text-lg">{percent}%</div>
        </div>
      );
    }

            <div className="text-sm text-brand-600 font-medium truncate">→ {d.output}</div>
          </div>
          {isCurrent && <span className="hidden sm:inline shrink-0 rounded-full bg-brand-500 text-white px-2.5 py-1 text-xs font-bold">진행중</span>}
          <span className="shrink-0 text-gray-300 group-hover:text-brand-400 transition">›</span>
        </button>
      );
    }

    function WeekSection({ week, cur, onOpen }) {
      const days = DATA.days.filter((d) => d.week === week.id);
      const doneCount = days.filter((d) => d.day < cur).length;
      return (
        <section id={"sec-" + week.id} className="scroll-mt-32">
          <div className="flex items-baseline gap-3 flex-wrap">
            <span className="text-2xl">{week.emoji}</span>
            <h2 className="text-2xl font-black text-ink">
              <span className="text-brand-500">{week.code}</span> · {week.name}
            </h2>
            <span className="text-sm text-gray-400 font-medium">{week.range}</span>
            <span className="ml-auto text-sm text-gray-500 font-semibold">{doneCount}/{days.length} 완료</span>
          </div>
          <p className="mt-1 text-sm text-gray-500">이 주가 끝나면 — <b className="text-ink">{week.outcome}</b></p>
          <div className="mt-4 space-y-2.5">
            {days.map((d) => <DayRow key={d.day} d={d} cur={cur} onOpen={onOpen} />)}
          </div>
        </section>
      );
    }

    function LockedSection() {
      const L = DATA.lockedTeaser;
      return (
        <section id="sec-locked" className="scroll-mt-32">
          <div className="rounded-3xl bg-gray-900 text-white p-8 sm:p-10 relative overflow-hidden">
            <div className="pointer-events-none absolute -right-16 -top-16 w-64 h-64 rounded-full bg-brand-500/20 blur-3xl" />
            <div className="relative">
              <span className="inline-flex items-center gap-1.5 rounded-full bg-white/10 px-3 py-1.5 text-sm font-bold">
                🔒 {L.code}
              </span>
              <h2 className="mt-4 text-2xl sm:text-3xl font-black">{L.title}</h2>
              <p className="mt-3 text-gray-300 max-w-2xl leading-relaxed">{L.desc}</p>

              <div className="mt-7 grid sm:grid-cols-3 gap-3">
                {DATA.lockedDays.slice(0, 3).map((d) => (
                  <div key={d.day} className="rounded-2xl bg-white/5 border border-white/10 p-4">
                    <div className="text-xs text-gray-400 font-semibold">Day {d.day}</div>
                    <div className="mt-1 font-bold blur-[3px] select-none">{d.title}</div>
                    <div className="mt-3 text-lg">🔒</div>
                  </div>
                ))}
              </div>
              <div className="mt-3 flex items-center gap-3 text-gray-500">
                <div className="flex-1 border-t border-dashed border-white/15" />
                <span className="text-sm">Day 31 ~ 60 · 계속</span>
                <div className="flex-1 border-t border-dashed border-white/15" />
              </div>

              <p className="mt-6 text-sm text-brand-300 font-semibold">✨ {L.note}</p>
            </div>
          </div>
        </section>
      );
    }

    /* Day 상세 미리보기 모달 (10개 영역 구조) */
    function DayModal({ d, cur, onClose }) {
      const week = DATA.weeks.find((w) => w.id === d.week);
      const t = DATA.typeMeta[d.type];
      const isConcept = d.type === "concept";
      const status = statusOf(d.day, cur);

      const template =
        "[역할] 너는 내 업무를 돕는 어시스턴트야.\n" +
        "[오늘 맡길 일] " + d.title.replace(/[“”]/g, "") + "\n" +
        "[가진 자료] (엑셀·PDF·메일 등 여기에 붙여넣기 또는 업로드)\n" +
        "[원하는 결과물] " + d.output + "\n" +
        "[형식] 표 / 요약 / 초안 중 택1 — 바로 쓸 수 있게";

      // 개념 유닛은 ③⑥⑦ 자리에 시뮬레이터 퀴즈가 들어간다.
      const conceptReplaced = { video: true, mission: true, verify: true };

      const contentFor = (key) => {
        switch (key) {
          case "progress": return `Day ${d.day} / 60 · 이번 주: ${week.name}`;
          case "oneline":  return d.title;
          case "concept":  return "슬라이드 스타일 개념 카드 + 한 문장 설명";
          case "guide":    return "‘잘 모르겠으면 여기!’ — 오늘의 추천 선택 1개";
          case "mission":  return "옆 Claude 창에서 오늘의 한 가지를 직접 수행";
          case "verify":   return "결과 스크린샷 또는 대화 링크 제출";
          case "quiz":     return "상황형 2~3문항 · 오답 시 설명 제공";
          case "output":   return d.output;
          case "nav":      return "‹ 이전 Day   ·   다음 Day ›   ·   이어하기";
          default:         return "";
        }
      };

      return (
        <div className="fixed inset-0 z-[100] bg-black/40 backdrop-blur-sm grid place-items-end sm:place-items-center p-0 sm:p-6"
             onClick={onClose}>
          <div className="bg-cream w-full sm:max-w-2xl max-h-[92vh] sm:max-h-[88vh] overflow-y-auto rounded-t-3xl sm:rounded-3xl shadow-card animate-popIn no-scrollbar"
               onClick={(e) => e.stopPropagation()}>
            {/* 모달 헤더 */}
            <div className="sticky top-0 bg-cream/95 backdrop-blur border-b border-brand-100 px-6 py-4 flex items-center gap-3">
              <span className={"rounded-full px-2.5 py-1 text-xs font-bold " + TYPE_BADGE[d.type]}>{t.label}</span>
              <div className="min-w-0">
                <div className="text-xs text-gray-400 font-semibold">Day {d.day} · {week.code}</div>
                <div className="font-black text-ink truncate">{d.title}</div>
              </div>
              <button onClick={onClose} className="ml-auto shrink-0 w-9 h-9 rounded-full bg-white border border-gray-200 grid place-items-center text-gray-500 hover:bg-gray-50">✕</button>
            </div>

            <div className="px-6 py-5">
              <div className="rounded-xl bg-brand-50 border border-brand-100 px-4 py-3 text-sm text-brand-700">
                {isConcept
                  ? "🌱 개념 학습(워밍업) 구간 — 아직 Claude를 쓰지 않고, 사이트 안에서 시뮬레이터 퀴즈로 완결합니다."
                  : "🖥️ 실전 구간 — 화면을 나눠 옆 Claude 창에서 직접 해보고 결과물을 남깁니다."}
              </div>

              <div className="mt-5 text-sm font-bold text-gray-400">Day 유닛 구조 · 10개 영역</div>
              <div className="mt-3 space-y-2.5">
                {DATA.unitAreas.map((a) => {
                  const replaced = isConcept && conceptReplaced[a.key];
                  return (
                    <div key={a.key}
                      className={"rounded-2xl border p-3.5 flex gap-3 items-start " +
                        (replaced ? "bg-gray-50 border-gray-200" : "bg-white border-brand-100")}>
                      <div className="shrink-0 w-9 text-center">
                        <div className="text-brand-400 font-black text-sm">{a.n}</div>
                        <div className="text-lg leading-none mt-0.5">{a.icon}</div>
                      </div>
                      <div className="min-w-0 flex-1">
                        <div className="font-bold text-ink text-sm">{a.name}</div>
                        {replaced ? (
                          <div className="text-sm text-gray-400 mt-0.5">개념 구간 — 이 자리에 <b>시뮬레이터 퀴즈</b>가 들어갑니다.</div>
                        ) : (
                          <div className="text-sm text-gray-500 mt-0.5">{contentFor(a.key)}</div>
                        )}

                        {/* ⑨ 오늘의 결과물 — 복붙 템플릿 */}
                        {a.key === "output" && !replaced && (
                          <div className="mt-2.5">
                            <pre className="rounded-xl bg-gray-900 text-gray-100 text-[12px] leading-relaxed p-3.5 whitespace-pre-wrap font-sans">{template}</pre>
                            <button
                              onClick={() => copyText(template, "오늘의 결과물 템플릿을 복사했어요 📋")}
                              className="mt-2 inline-flex items-center gap-1.5 rounded-xl bg-brand-500 hover:bg-brand-600 text-white px-3.5 py-2 text-sm font-bold transition">
                              📋 템플릿 복사하기
                            </button>
                          </div>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>

              <div className="mt-5 flex gap-2">
                <button onClick={onClose} className="flex-1 rounded-xl border border-gray-200 bg-white py-3 font-bold text-ink hover:bg-gray-50 transition">닫기</button>
                <button
                  onClick={() => showToast(status === "todo" ? "완주 순서대로 열립니다 🔒" : "데모 화면입니다 · Day 상세는 다음 스코프예요")}
                  className="flex-1 rounded-xl bg-brand-500 hover:bg-brand-600 text-white py-3 font-bold transition">
                  {status === "current" ? "이어서 학습하기 →" : status === "done" ? "다시 보기" : "미리보기"}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function CourseOverview() {
      const cur = DATA.progress.currentDay;
      const [openDay, setOpenDay] = useState(null);
      const currentDayObj = useMemo(() => DATA.days.find((d) => d.day === cur), [cur]);

      // 모달 열릴 때 배경 스크롤 잠금
      useEffect(() => {
        document.body.style.overflow = openDay ? "hidden" : "";
        return () => { document.body.style.overflow = ""; };
      }, [openDay]);

      return (
        <div className="bg-cream text-ink min-h-screen">
          <CourseHeader onResume={() => setOpenDay(currentDayObj)} />
          <WeekNav />

          <div className="max-w-6xl mx-auto px-5 py-8">
            {/* 진행 요약 배너 */}
            <div className="rounded-3xl bg-white border border-brand-100 p-6 sm:p-7 shadow-soft flex flex-col sm:flex-row items-start sm:items-center gap-5">
              <ProgressRing percent={DATA.progress.percent} />
              <div className="flex-1">
                <div className="text-2xl font-black text-ink">
                  {DATA.progress.currentDay} <span className="text-gray-400 font-bold">/ {DATA.progress.totalDays}일</span>
                  <span className="ml-2 text-brand-500">진행 중</span>
                </div>
                <div className="mt-1.5 h-2.5 rounded-full bg-brand-50 overflow-hidden max-w-md">
                  <div className="h-full bg-brand-500 rounded-full" style={{ width: DATA.progress.percent + "%" }} />
                </div>
                <p className="mt-2 text-sm text-gray-500">
                  60일 중 <b className="text-ink">{DATA.progress.totalDays - DATA.progress.currentDay + 1}일</b> 남았어요 ·
                  완주하면 <b className="text-brand-600"> 10만원 환급</b> (아직 {100 - DATA.progress.percent}% 남았어요)
                </p>
              </div>
              <CTA size="md" onClick={() => setOpenDay(currentDayObj)} className="w-full sm:w-auto">
                Day {cur} 이어하기 →
              </CTA>
            </div>

            {/* 1~30일: 4주 + 마무리 */}
            <div className="mt-10 space-y-12">
              {DATA.weeks.map((w) => (
                <WeekSection key={w.id} week={w} cur={cur} onOpen={setOpenDay} />
              ))}
            </div>

            {/* 31~60일: 잠금 */}
            <div className="mt-12">
              <LockedSection />
            </div>

            <div className="h-24" />
          </div>

          {/* 플로팅 이어하기 */}
          <button
            onClick={() => setOpenDay(currentDayObj)}
            className="fixed bottom-6 right-6 z-30 rounded-2xl bg-brand-500 hover:bg-brand-600 text-white px-5 py-3.5 font-black shadow-card active:scale-[.98] transition animate-floaty">
            ▶ Day {cur} 이어하기
          </button>

          {openDay && <DayModal d={openDay} cur={cur} onClose={() => setOpenDay(null)} />}
        </div>
      );
    }

    /* ─────────────────────────────────────────────────────────────
       라우터
    ───────────────────────────────────────────────────────────── */
    function parseRoute(hash) {
      const h = (hash || "#/").replace(/^#/, "");
      if (h.indexOf("/day/") === 0) { const n = parseInt(h.split("/")[2], 10); return { name: "day", day: isNaN(n) ? 1 : n }; }
      if (h.indexOf("/learn") === 0) return { name: "learn" };
      if (h.indexOf("/course") === 0) return { name: "learn" };   // 구 경로 → 학습 홈
      if (h.indexOf("/rules") === 0) return { name: "rules" };
      if (h.indexOf("/refund") === 0) return { name: "refund" };
      return { name: "home" };
    }

    function App() {
      const route = useHashRoute();
      const r = parseRoute(route);
      let page;
      if (r.name === "learn") page = <LearnHome />;
      else if (r.name === "day") page = <DayScreen day={r.day} />;
      else if (r.name === "rules") page = <RulesPage />;
      else if (r.name === "refund") page = <RefundPage />;
      else page = <Home />;
      const showDock = r.name !== "home";
      return (
        <AppProvider>
          {page}
          {showDock && <DemoDock />}
        </AppProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
