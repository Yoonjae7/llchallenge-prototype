<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>멋쟁이 챌린지 · 0부터 배포까지 - Claude 코스</title>

  <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: "#FAF8F5",
            ink:   "#1F2937",
            brand: {
              50:  "#FFF3ED", 100: "#FFE4D5", 200: "#FFC9AC", 300: "#FFA778",
              400: "#FF8747", 500: "#FF6000", 600: "#E05500", 700: "#B84600",
            },
          },
          fontFamily: {
            sans: ["Pretendard", "system-ui", "-apple-system", "Segoe UI", "sans-serif"],
          },
          boxShadow: {
            card: "0 6px 30px -12px rgba(224,85,0,0.20)",
            soft: "0 2px 16px -6px rgba(31,41,55,0.10)",
            lift: "0 18px 50px -20px rgba(31,41,55,0.28)",
          },
        },
      },
    };
  </script>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    Babel.registerPreset("react-classic", {
      presets: [[Babel.availablePresets.react, { runtime: "classic" }]],
    });

    /* days/dayNN.js 안의 비주얼을 JSX 그대로 두면서도 이 페이지를 파일로 직접 열 수 있게 하는 장치.
       type="text/babel" + src= 는 Babel이 그 파일을 네트워크로 가져와야 하는데, file:// 로 열면
       브라우저가 그 요청을 막아버린다 - 그래서 예전엔 index.html 을 더블클릭하면 Day 26~45 가
       통째로 안 붙었다(1~25 만 보였다). 이제 Day 파일은 평범한 <script src> 로 불러오고,
       그 안의 비주얼만 문자열로 담아 여기서 Babel 로 컴파일한다. 가져올 파일이 없으니 file:// 에서도
       그대로 돌아간다. JSX 문법은 그대로 쓸 수 있어서 편집 감각도 안 바뀐다. */
    window.MJC_JSX = function (src) {
      var out = Babel.transform("(" + src + ")", { presets: ["react-classic"] }).code;
      return (0, eval)(out);
    };
  </script>

  <style>
    html { scroll-behavior: smooth; }
    body { background: #FAF8F5; -webkit-font-smoothing: antialiased; }
    ::selection { background: #FFD9C2; }

    /* 슬라이드 전환 (방향 인식) */
    @keyframes slideInR  { from { opacity:0; transform: translateX(34px) scale(.985); } to { opacity:1; transform:none; } }
    @keyframes slideInL  { from { opacity:0; transform: translateX(-34px) scale(.985); } to { opacity:1; transform:none; } }
    @keyframes fadeUp    { from { opacity:0; transform: translateY(14px); } to { opacity:1; transform:none; } }
    @keyframes revealUp  { from { opacity:0; transform: translateY(10px); filter: blur(3px); } to { opacity:1; transform:none; filter:none; } }
    @keyframes popIn     { from { opacity:0; transform: scale(.94); } to { opacity:1; transform:none; } }
    @keyframes floaty    { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
    @keyframes shake     { 10%,90%{transform:translateX(-2px)} 30%,70%{transform:translateX(4px)} 50%{transform:translateX(-4px)} }
    @keyframes nudgeR    { 0%,100% { transform: translateX(0); opacity:.5 } 50% { transform: translateX(12px); opacity:1 } }
    @keyframes flowNudge { 0% { transform: translateX(-3px); opacity:.35 } 50% { transform: translateX(2px); opacity:1 } 100% { transform: translateX(-3px); opacity:.35 } }
    @keyframes caretBlink { 0%,45% { opacity:0 } 55%,100% { opacity:1 } }
    @keyframes bar       { from { width: 0 } to { width: 100% } }
    @keyframes barGrow   { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    @keyframes barPulse  { 0%,100% { transform: scaleY(1); } 45% { transform: scaleY(.82); } }
    @keyframes ringFill  { from { stroke-dashoffset: 163.4; } to { stroke-dashoffset: 49; } }
    @keyframes flicker   { 0%,100% { transform: scale(1) rotate(-2deg); } 50% { transform: scale(1.08) rotate(2deg); } }
    @keyframes trendDraw { to { stroke-dashoffset: 0; } }
    @keyframes pulseRing { 0%,100% { box-shadow: 0 0 0 0 rgba(16,185,129,.35); } 50% { box-shadow: 0 0 0 5px rgba(16,185,129,0); } }
    @keyframes twinkle   { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.8); } }
    @keyframes flameFlicker { from { transform: scaleY(1) scaleX(1); } to { transform: scaleY(.8) scaleX(1.15); } }
    @keyframes growRight  { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes spinLoop   { to { transform: rotate(360deg); } }
    @keyframes fadeDrift  { 0%,100% { opacity: .35; } 50% { opacity: .7; } }
    @keyframes flyIn     { from { opacity:0; transform: translateY(-14px) rotate(-8deg); } to { opacity:1; transform: translateY(0) rotate(-3deg); } }
    @keyframes pulseSoft { 0%,100% { opacity:1; } 50% { opacity:.35; } }
    @keyframes sheen     { from { background-position: -180% 0 } to { background-position: 220% 0 } }
    @keyframes dashFlow  { to { stroke-dashoffset: -20; } }
    @keyframes radarPing { 0% { transform: scale(.4); opacity: .6; } 100% { transform: scale(2.2); opacity: 0; } }
    .connector-flow { animation: dashFlow .9s linear infinite; }
    .connector-ping { animation: radarPing 1.8s cubic-bezier(.25,.7,.4,1) infinite; }
    @keyframes connectorDrip { 0% { top: -4%; opacity: 0; transform: scale(.5); } 22% { opacity: 1; transform: scale(1); } 78% { opacity: 1; } 100% { top: 100%; opacity: 0; transform: scale(.5); } }
    .connector-drip { animation: connectorDrip 1.5s cubic-bezier(.4,0,.6,1) infinite; }
    @keyframes raceSlow { 0% { transform: scaleX(0); } 88%,100% { transform: scaleX(1); } }
    @keyframes raceFast { 0% { transform: scaleX(0); } 18%,100% { transform: scaleX(1); } }
    .race-slow { animation: raceSlow 3.6s cubic-bezier(.3,.1,.2,1) infinite; }
    .race-fast { animation: raceFast 3.6s cubic-bezier(.2,.8,.3,1) infinite; }
    @keyframes narrowNudge { 0%,55%,100% { transform: translateX(0); } 25% { transform: translateX(-14px); } }
    .narrow-nudge { animation: narrowNudge 1.6s ease-in-out infinite; }
    /* 좁은 화면 경고 - 말로 설명하는 대신 경계선이 실제로 왼쪽으로 밀리며 왼쪽 창이 넓어지는 걸
       반복해서 보여준다. 마지막 키프레임이 "넓어진 상태"라 prefers-reduced-motion 으로 1회만
       재생돼도 도달해야 할 모습에서 멈춘다 */
    @keyframes paneWiden { 0%,14% { flex-basis: 34%; } 62%,100% { flex-basis: 66%; } }
    .pane-widen { animation: paneWiden 2.6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes grabPulse { 0%,14% { transform: scale(1); opacity:.55 } 30% { transform: scale(1.25); opacity:1 } 62%,100% { transform: scale(1); opacity:.9 } }
    .grab-pulse { animation: grabPulse 2.6s cubic-bezier(.4,0,.2,1) infinite; }
    /* 오른쪽 빈 칸으로 클로드 창이 미끄러져 들어온다. 마지막 키프레임이 '자리를 채운 상태'라
       prefers-reduced-motion 으로 1회만 재생돼도 도달해야 할 모습에서 멈춘다 */
    @keyframes claudeSlideIn { 0%,10% { transform: translateX(105%); opacity:0 } 45%,100% { transform: translateX(0); opacity:1 } }
    .claude-slide-in { animation: claudeSlideIn 3s cubic-bezier(.4,0,.2,1) infinite; }
    /* 지침 공식(입력→동작→출력) 사이 아래 화살표. 흐름이 한 방향으로 흐른다는 걸 계속 알린다 */
    @keyframes nudgeD { 0%,100% { transform: translateY(0); opacity:.4 } 50% { transform: translateY(4px); opacity:1 } }
    .nudge-d { animation: nudgeD 1.5s ease-in-out infinite; }
    /* 내려받을 수 있는 결과물이라는 신호 - 파일 카드의 다운로드 화살표가 계속 살짝 튄다 */
    @keyframes dlBounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(2.5px); } }
    .dl-bounce { animation: dlBounce 1.3s ease-in-out infinite; }
    /* 눌렸다 튀어 오르는 버튼 모션. Day 21 trioCompare(스킬 = 내가 눌러야 작동)에서 쓰다가
       2026-08-18 그 비주얼이 skillScope로 교체되며 지금은 쓰는 곳이 없다 - 다른 비주얼의 은은한
       opacity 펄스와 확실히 구분되는 모션이라 재사용을 위해 남겨둔다 */
    @keyframes buttonPress { 0%,55%,100% { transform: scale(1); } 66% { transform: scale(.86); } 76% { transform: scale(1.06); } 86% { transform: scale(1); } }
    .btn-press { animation: buttonPress 3.4s ease-in-out infinite; }
    /* 단계별로 차오르는 게이지. Day 21 threeTimesRule('같은 걸 세 번' 카운터)에서 쓰다가 2026-08-18
       그 비주얼이 폐기되며 지금은 쓰는 곳이 없다 - 재사용 가치가 있어 남겨둔다.
       width 대신 scaleX 로 그린다 - 레이아웃을 다시 잡지 않아 가볍고, 무엇보다 마지막 키프레임이
       '꽉 찬 상태'라서 모션을 끈 사용자(prefers-reduced-motion)에게도 게이지가 채워진 채로 남는다.
       width 로 하면 마지막이 0% 라 게이지가 아예 안 보였다 */
    @keyframes tallyFill { 0%,5% { transform: scaleX(0); } 28%,33% { transform: scaleX(.5); } 56%,100% { transform: scaleX(1); } }
    .tally-fill { transform-origin: left; animation: tallyFill 4.2s cubic-bezier(.4,0,.3,1) infinite; }
    .anim-in-r        { animation: slideInR .34s cubic-bezier(.22,.9,.3,1) both; }
    .anim-in-l        { animation: slideInL .34s cubic-bezier(.22,.9,.3,1) both; }
    .animate-fadeUp   { animation: fadeUp .5s ease both; }
    .animate-revealUp { animation: revealUp .42s cubic-bezier(.22,.9,.3,1) both; }
    .animate-popIn    { animation: popIn .2s cubic-bezier(.2,.9,.3,1.15) both; }
    .animate-floaty   { animation: floaty 4s ease-in-out infinite; }
    .animate-shake    { animation: shake .4s ease both; }
    .animate-nudgeR   { animation: nudgeR 1.4s ease-in-out infinite; }
    .sheen { background-image: linear-gradient(105deg, transparent 38%, rgba(255,255,255,.55) 50%, transparent 62%);
             background-size: 220% 100%; animation: sheen 2.6s ease-in-out infinite; }

    .stagger > * { animation: fadeUp .44s ease both; }
    .stagger > *:nth-child(1){animation-delay:.04s} .stagger > *:nth-child(2){animation-delay:.10s}
    .stagger > *:nth-child(3){animation-delay:.16s} .stagger > *:nth-child(4){animation-delay:.22s}
    .stagger > *:nth-child(5){animation-delay:.28s} .stagger > *:nth-child(6){animation-delay:.34s}

    /* 슬라이드를 같은 그리드 칸에 겹쳐 쌓는다. 덱 높이가 고정되어 아래 컨트롤이 안 튄다. */
    .deck-stack { display: grid; }
    .deck-stack > * { grid-area: 1 / 1; min-height: 0; }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .rich b { font-weight: 800; color: #111827; }
    .rich i { font-style: normal; color: #6B7280; background:#F3F4F6; padding:.05em .35em; border-radius:.3em; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <!-- 설정 화면 스크린샷(base64). 용량이 커서 커리큘럼 데이터와 분리했다 -->
  <script src="assets.js"></script>
  <!-- 커리큘럼 데이터: Day 메타 + 슬라이드/퀴즈/미션 콘텐츠 (Day 1~25) -->
  <script src="data.js"></script>

  <!-- Day 26~45. 한 Day = 한 파일이고, 그 안에 슬라이드·퀴즈·미션·전용 비주얼이 다 들어 있다.
       전부 평범한 <script src> 다 - type="text/babel" 을 쓰면 Babel이 그 파일을 네트워크로
       가져와야 해서 index.html 을 더블클릭(file://)했을 때 Day 26~45 가 통째로 안 붙는다.
       그래서 비주얼의 JSX는 파일 안에서 MJC_JSX(`...`) 문자열로 두고 위쪽에서 컴파일한다.
       순서는 지켜야 한다 - dayNN.js 전부 → _register.js → 아래 본체 스크립트. -->
  <script src="days/day26.js"></script>
  <script src="days/day27.js"></script>
  <script src="days/day28.js"></script>
  <script src="days/day29.js"></script>
  <script src="days/day30.js"></script>
  <script src="days/day31.js"></script>
  <script src="days/day32.js"></script>
  <script src="days/day33.js"></script>
  <script src="days/day34.js"></script>
  <script src="days/day35.js"></script>
  <script src="days/day36.js"></script>
  <script src="days/day37.js"></script>
  <script src="days/day38.js"></script>
  <script src="days/day39.js"></script>
  <script src="days/day40.js"></script>
  <script src="days/day41.js"></script>
  <script src="days/day42.js"></script>
  <script src="days/day43.js"></script>
  <script src="days/day44.js"></script>
  <script src="days/day45.js"></script>
  <script src="days/_register.js"></script>

  <script type="text/babel" data-presets="react-classic">
    const { useState, useEffect, useLayoutEffect, useMemo, useRef, useCallback, createContext, useContext } = React;
    const DATA = window.MJC_DATA;

    /* Day 타입별 앰비언트 컬러. 기획안 주석: concept 그린 · practice 앰버 · project 핑크 */
    const THEME = {
      concept: {
        label: "개념", emoji: "🟢", act: "퀴즈",
        text: "text-emerald-700", textSoft: "text-emerald-600",
        bg: "bg-emerald-50", border: "border-emerald-200",
        solid: "bg-emerald-500", solidHover: "hover:bg-emerald-600",
        badge: "bg-emerald-100 text-emerald-700 border border-emerald-200",
        chip: "bg-emerald-500 text-white", bar: "bg-emerald-500", ring: "ring-emerald-300",
      },
      practice: {
        label: "실습", emoji: "🟡", act: "미션",
        text: "text-amber-700", textSoft: "text-amber-600",
        bg: "bg-amber-50", border: "border-amber-200",
        solid: "bg-amber-500", solidHover: "hover:bg-amber-600",
        badge: "bg-amber-100 text-amber-700 border border-amber-200",
        chip: "bg-amber-500 text-white", bar: "bg-amber-500", ring: "ring-amber-300",
      },
      project: {
        label: "프로젝트", emoji: "🚀", act: "미션",
        text: "text-pink-700", textSoft: "text-pink-600",
        bg: "bg-pink-50", border: "border-pink-200",
        solid: "bg-pink-500", solidHover: "hover:bg-pink-600",
        badge: "bg-pink-100 text-pink-700 border border-pink-200",
        chip: "bg-pink-500 text-white", bar: "bg-pink-500", ring: "ring-pink-300",
      },
    };

    /* 유틸 */
    function go(hash) { window.location.hash = hash; window.scrollTo({ top: 0, behavior: "auto" }); }
    function useHashRoute() {
      const [route, setRoute] = useState(window.location.hash || "#/day/1");
      useEffect(() => {
        const on = () => setRoute(window.location.hash || "#/day/1");
        window.addEventListener("hashchange", on);
        return () => window.removeEventListener("hashchange", on);
      }, []);
      return route;
    }
    function showToast(msg) {
      const t = document.createElement("div");
      t.textContent = msg;
      t.className = "fixed left-1/2 -translate-x-1/2 bottom-10 z-[300] px-4 py-2.5 rounded-full bg-ink text-white text-sm font-bold shadow-lift animate-popIn";
      document.body.appendChild(t);
      setTimeout(() => { t.style.transition = "opacity .3s"; t.style.opacity = "0"; }, 1400);
      setTimeout(() => t.remove(), 1800);
    }
    function loadLS(k, f) { try { const v = localStorage.getItem(k); return v == null ? f : JSON.parse(v); } catch (e) { return f; } }
    function saveLS(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
    function fill(t, n) { return (t || "").split("{{name}}").join(n || DATA.DEMO_NAME); }
    const strip = (s) => (s || "").replace(/<[^>]+>/g, "");

    function RichInline({ text, name, className }) {
      return <span className={"rich " + (className || "")} dangerouslySetInnerHTML={{ __html: fill(text, name) }} />;
    }

    /* Day 테마 색으로 채워지는 기본 CTA 버튼. disabled 면 회색으로 빠진다.
       size: "base" | "lg" · layout: "full" | "flex1" · extra: 추가로 붙일 클래스(애니메이션 등) */
    function ThemedCTA({ theme, disabled, onClick, size, layout, extra, children }) {
      const sizeCls = size === "lg" ? "py-4 text-lg" : "py-3.5 text-base";
      const layoutCls = layout === "flex1" ? "flex-1" : "w-full";
      return (
        <button disabled={disabled} onClick={onClick}
          className={layoutCls + " " + sizeCls + " rounded-2xl font-black shadow-card transition active:scale-[.99] " + (extra || "") + " " +
            (disabled ? "bg-gray-200 text-gray-400 cursor-not-allowed" : "text-white " + theme.solid + " " + theme.solidHover)}>
          {children}
        </button>
      );
    }

    async function copyText(t) {
      try { await navigator.clipboard.writeText(t); showToast("복사했어요 📋"); }
      catch (e) { showToast("복사에 실패했어요. 직접 선택해 주세요"); }
    }
    function downloadBlob(filename, text, mime) {
      const blob = new Blob(["﻿" + text], { type: (mime || "text/plain") + ";charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showToast(filename + " 내려받았어요 ⬇️");
    }

    const UICtx = createContext({});
    const useUI = () => useContext(UICtx);
    const PLAN_NOTES = /[?&]notes=1/.test(window.location.search);

    /* 떠 있는 버튼. 항상 보이도록 모든 단계에서 렌더한다.
       liftForHint 가 켜지면(모바일에서 스플릿스크린 배너가 하단에 떠 있을 때) 배너 위로 자리를 옮긴다. */
    function Fabs({ liftForHint }) {
      const { openGrid, openName } = useUI();
      return (
        <div className={"fixed right-5 z-[150] flex flex-col gap-2.5 transition-[bottom] duration-200 " +
          (liftForHint ? "bottom-36 lg:bottom-5" : "bottom-5")}>
          <button onClick={openName} title="내 이름 설정"
            className="w-11 h-11 rounded-full bg-white border border-gray-200 text-gray-500 grid place-items-center text-lg shadow-soft hover:scale-105 transition">🦁</button>
          <button onClick={openGrid} title="전체 목차"
            className="w-14 h-14 rounded-full bg-ink text-white grid place-items-center text-2xl shadow-lift hover:scale-105 transition">📚</button>
        </div>
      );
    }

    /* 학습 화면 전용 - 화면 높이가 빠듯해서 목차 버튼 하나만, 작게. 이름 설정은 상단 바에 따로 둔다. */
    function LearnFab({ liftForHint }) {
      const { openGrid } = useUI();
      return (
        <button onClick={openGrid} title="전체 목차"
          className={"fixed right-5 z-[150] w-11 h-11 rounded-full bg-ink text-white grid place-items-center text-xl shadow-lift hover:scale-105 transition-[bottom] duration-200 " +
            (liftForHint ? "bottom-24 lg:bottom-3" : "bottom-3")}>📚</button>
      );
    }

    /* 진행상황 */
    function useProgress() {
      const [done, setDone] = useState(() => loadLS("mjc.done", []));
      const complete = useCallback((n) => {
        setDone((d) => { if (d.indexOf(n) !== -1) return d; const x = d.concat([n]).sort((a, b) => a - b); saveLS("mjc.done", x); return x; });
      }, []);
      const isDone = useCallback((n) => done.indexOf(n) !== -1, [done]);
      return { done, isDone, complete };
    }

    /* 스플릿스크린 감지 */
    function isSplitNow() {
      const avail = (window.screen && window.screen.availWidth) || 0;
      const w = window.outerWidth || window.innerWidth || 0;
      if (!avail || !w) return true;
      return w / avail <= 0.72;
    }
    function useSplitScreen() {
      const [split, setSplit] = useState(isSplitNow);
      useEffect(() => {
        const on = () => setSplit(isSplitNow());
        window.addEventListener("resize", on);
        const id = setInterval(on, 1200);
        return () => { window.removeEventListener("resize", on); clearInterval(id); };
      }, []);
      return split;
    }

    /* 너무 좁은 스플릿스크린 감지 - 마우스로 조작하는(터치가 아닌) 창이 비정상적으로 좁을 때만 잡는다.
       화면 자체가 좁은 폰·태블릿은 정상 사용이라 건드리지 않는다.
       screen.availWidth 로 "데스크탑인지"를 판단하면 브라우저 창 크기를 조정할 때 그 값도 같이
       바뀌는 경우가 있어 신뢰할 수 없다 - 대신 주 입력 장치가 마우스인지(pointer: fine)로 구분한다.
       maxTouchPoints > 0 만으로는 안 된다 - 터치스크린 노트북도 실제로는 마우스·트랙패드로 쓰는
       경우가 많아서, 그 신호만 보면 정작 좁혀야 할 사람을 놓친다 */
    /* 460 이었을 땐 이 경고가 사실상 뜰 수 없었다 - 크롬은 창을 대략 500px 아래로 못 줄여서,
       스플릿을 끝까지 좁혀도 innerWidth 가 460 밑으로 안 내려갔다. 즉 "최대로 좁혀도 알림이
       안 뜬다"는 게 정상 동작이 아니라 임계값이 도달 불가였던 것.
       지금은 이 덱의 2단 레이아웃이 무너지는 sm(640px) 바로 아래인 600 을 기준으로 잡았다 -
       1280 화면을 정확히 반 나눈 경우(≈630)는 통과시키고, 그보다 더 좁힌 경우만 잡는다 */
    const MIN_USABLE_WIDTH = 600;
    function isTooNarrowNow() {
      const w = window.innerWidth || 0;
      if (!w) return false;
      const mouseIsPrimary = !window.matchMedia || window.matchMedia("(pointer: fine)").matches;
      if (!mouseIsPrimary) return false;
      return w < MIN_USABLE_WIDTH;
    }
    function useNarrowGuard() {
      const [narrow, setNarrow] = useState(isTooNarrowNow);
      useEffect(() => {
        const on = () => setNarrow(isTooNarrowNow());
        window.addEventListener("resize", on);
        const id = setInterval(on, 1000);
        return () => { window.removeEventListener("resize", on); clearInterval(id); };
      }, []);
      return narrow;
    }

    /* 내 노트 */
    const noteKey = (d) => "mjc.note." + d;

    function NotePanel({ day, meta, onClose }) {
      const [text, setText] = useState(() => loadLS(noteKey(day), ""));
      const [flash, setFlash] = useState(false);
      const taRef = useRef(null);
      const panelRef = useRef(null);
      const dragRef = useRef(null);
      const [pos, setPos] = useState(null); // null = 기본 위치(우하단), 드래그하면 픽셀 좌표로 고정
      const [dragging, setDragging] = useState(false);

      useEffect(() => { setText(loadLS(noteKey(day), "")); }, [day]);
      useEffect(() => { if (taRef.current) taRef.current.focus(); }, []);

      const update = (v) => {
        setText(v); saveLS(noteKey(day), v);
        setFlash(true); clearTimeout(update._t);
        update._t = setTimeout(() => setFlash(false), 900);
      };
      const stamp = () => new Date().toISOString().slice(0, 10);
      const header = "멋쟁이 챌린지 · Day " + day + " : " + meta.name + "\n" + meta.chapter + " · " + meta.chapterTitle +
                     "\n작성일 " + stamp() + "\n" + "─".repeat(40) + "\n\n";

      const saveOne = () => {
        if (!text.trim()) return showToast("먼저 노트를 작성해 주세요 ✍️");
        downloadBlob("멋쟁이챌린지 Day " + day + " 노트.txt", header + text, "text/plain");
      };

      /* 헤더를 드래그해서 패널을 화면 어디로든 옮길 수 있게 한다 */
      const onDragStart = (e) => {
        if (e.target.closest("button")) return;
        const rect = panelRef.current.getBoundingClientRect();
        dragRef.current = { startX: e.clientX, startY: e.clientY, origX: rect.left, origY: rect.top };
        setPos({ x: rect.left, y: rect.top });
        setDragging(true);
        e.currentTarget.setPointerCapture(e.pointerId);
      };
      const onDragMove = (e) => {
        if (!dragRef.current) return;
        const w = panelRef.current.offsetWidth, h = panelRef.current.offsetHeight;
        const maxX = Math.max(4, window.innerWidth - w - 4);
        const maxY = Math.max(4, window.innerHeight - h - 4);
        const x = Math.min(Math.max(4, dragRef.current.origX + (e.clientX - dragRef.current.startX)), maxX);
        const y = Math.min(Math.max(4, dragRef.current.origY + (e.clientY - dragRef.current.startY)), maxY);
        setPos({ x, y });
      };
      const onDragEnd = () => { dragRef.current = null; setDragging(false); };

      const posStyle = pos ? { left: pos.x + "px", top: pos.y + "px", right: "auto", bottom: "auto" } : undefined;

      return (
        <div ref={panelRef}
          className={"fixed z-[210] inset-x-3 bottom-3 sm:inset-x-auto sm:right-5 sm:bottom-24 sm:w-[360px] " + (dragging ? "" : "animate-popIn")}
          style={posStyle}>

              className={"flex items-center gap-2 px-4 py-3 bg-ink text-white select-none " + (dragging ? "cursor-grabbing" : "cursor-grab")}

              <span className="shrink-0 rounded-md bg-gray-200 px-1.5 py-0.5 text-[9px] font-black text-gray-400">한 번</span>
              <span className="flex-1 text-[10px] font-bold text-gray-400 leading-snug">이번 행사 소개글 쓰기</span>
              <span className="shrink-0 text-[8.5px] font-black text-gray-400">그냥 시키기</span>
            </div>
          </div>
        );
      }

      /* Day 23 의 trioSummary(삼둥이 = 메모리·프로젝트·스킬 최종 정리)는 2026-08-18에 삭제했다.
         챕터 6은 실습 이틀이 전부 스킬 하나에 붙어 있어야 하는데, 마지막 날에 메모리·프로젝트까지
         묶어 정리하게 하면 PJT 성격이 섞여 "그래서 오늘 뭘 하는 Day냐"가 흐려진다는 판단. */

      /* Day 21 - 지침(그 프로젝트 안에서만) vs 스킬(채팅을 가리지 않음)의 '범위' 차이를
         실제 클로드 사이드바 목업 하나로 보여준다.
         v1(trioCompare, 메모리·지침=자동 배지 / 스킬=눌러야 작동하는 버튼)은 스킬의 핵심을
         조작 방식으로 잘못 짚었고, v2(점선 박스 안팎에 "통해요 / 안 통해요" 칩)는 무엇을 그린
         건지 여전히 안 읽힌다는 판정을 받아 2026-08-18에 v3으로 전면 교체했다.
         v3의 요점: 다이어그램을 그리지 말고 학습자가 매일 보는 화면(사이드바 대화 목록)을 그린 뒤
         뱃지만 얹는다. 주황 「지침」 뱃지는 프로젝트 블록 안에서 끊기고, 보라 「스킬」 뱃지는
         프로젝트 안팎 모두에 붙는다 - 경계가 어디서 멈추는지가 배치만으로 읽힌다. */
      if (kind === "skillScope") {
        const Badge = ({ kind: k }) => (
          <span className={"shrink-0 rounded px-1.5 py-[1px] text-[8px] font-black text-white " +
            (k === "지침" ? "bg-brand-500" : "bg-violet-600")}>{k}</span>
        );
        const Row = ({ title, badges, delay }) => (
          <div className="flex items-center gap-1.5 rounded-lg bg-white border border-gray-100 px-2 py-1.5"
            style={{ animation: "revealUp .35s " + delay + "s both" }}>
            <span className="shrink-0 w-3 h-3 text-gray-300"><IconChatPlus /></span>
            <span className="flex-1 min-w-0 truncate text-[9.5px] font-bold text-gray-600">{title}</span>
            {badges.map((b, i) => <Badge key={i} kind={b} />)}
          </div>
        );
        return (
          <div className={card}>
            {/* 클로드 사이드바 목업 */}
            <div className="rounded-2xl bg-white border border-gray-100 shadow-soft overflow-hidden">
              {/* 프로젝트 블록 - 왼쪽 굵은 레일이 곧 프로젝트 경계다 */}
              <div className="p-2 bg-brand-50/60 border-l-[3px] border-brand-400">
                <div className="flex items-center gap-1.5 px-0.5 pb-1.5">
                  <span className="shrink-0 w-3.5 h-3.5 text-brand-500"><IconFolder /></span>
                  <span className="text-[9.5px] font-black text-brand-600">프로젝트 「주간 리포트」</span>
                </div>
                <div className="space-y-1">
                  <Row title="2주차 매출 정리" badges={["지침", "스킬"]} delay={.1} />
                  <Row title="회의록 정리해줘" badges={["지침", "스킬"]} delay={.18} />
                </div>
              </div>
              {/* 프로젝트 밖 - 같은 사이드바, 경계 레일만 없다 */}
              <div className="p-2 border-t border-gray-100">
                <div className="px-0.5 pb-1.5 text-[9.5px] font-black text-gray-400">채팅</div>
                <div className="space-y-1">
                  <Row title="어제 회의록 정리해줘" badges={["스킬"]} delay={.26} />
                  <Row title="부산 여행 계획 짜줘" badges={["스킬"]} delay={.34} />
                </div>
              </div>
            </div>
            {/* 범례 - 위 목업에서 뱃지가 어디까지 붙었는지를 한 줄씩 회수한다 */}
            <div className="mt-2.5 space-y-1.5">
              <div className="flex items-center gap-2 rounded-xl bg-brand-50 border border-brand-200 px-2.5 py-2"
                style={{ animation: "revealUp .4s .45s both" }}>
                <span className="shrink-0 rounded px-1.5 py-[1px] text-[8px] font-black text-white bg-brand-500">지침</span>
                <span className="text-[9.5px] font-bold text-gray-600">이 <b className="text-brand-600">프로젝트 안에서만</b> 붙어요</span>
              </div>
              <div className="flex items-center gap-2 rounded-xl bg-violet-50 border border-violet-200 px-2.5 py-2"
                style={{ animation: "revealUp .4s .55s both" }}>
                <span className="shrink-0 rounded px-1.5 py-[1px] text-[8px] font-black text-white bg-violet-600">스킬</span>
                <span className="text-[9.5px] font-bold text-gray-600">프로젝트든 아니든 <b className="text-violet-700">그 업무면 붙어요</b></span>
              </div>
