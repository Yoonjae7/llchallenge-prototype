<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>멋쟁이 챌린지 · 0부터 배포까지 - Claude 코스</title>

  <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: "#FAF8F5",
            ink:   "#1F2937",
            brand: {
              50:  "#FFF3ED", 100: "#FFE4D5", 200: "#FFC9AC", 300: "#FFA778",
              400: "#FF8747", 500: "#FF6000", 600: "#E05500", 700: "#B84600",
            },
          },
          fontFamily: {
            sans: ["Pretendard", "system-ui", "-apple-system", "Segoe UI", "sans-serif"],
          },
          boxShadow: {
            card: "0 6px 30px -12px rgba(224,85,0,0.20)",
            soft: "0 2px 16px -6px rgba(31,41,55,0.10)",
            lift: "0 18px 50px -20px rgba(31,41,55,0.28)",
          },
        },
      },
    };
  </script>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    Babel.registerPreset("react-classic", {
      presets: [[Babel.availablePresets.react, { runtime: "classic" }]],
    });
  </script>

  <style>
    html { scroll-behavior: smooth; }
    body { background: #FAF8F5; -webkit-font-smoothing: antialiased; }
    ::selection { background: #FFD9C2; }

    /* 슬라이드 전환 (방향 인식) */
    @keyframes slideInR  { from { opacity:0; transform: translateX(34px) scale(.985); } to { opacity:1; transform:none; } }
    @keyframes slideInL  { from { opacity:0; transform: translateX(-34px) scale(.985); } to { opacity:1; transform:none; } }
    @keyframes fadeUp    { from { opacity:0; transform: translateY(14px); } to { opacity:1; transform:none; } }
    @keyframes revealUp  { from { opacity:0; transform: translateY(10px); filter: blur(3px); } to { opacity:1; transform:none; filter:none; } }
    @keyframes popIn     { from { opacity:0; transform: scale(.94); } to { opacity:1; transform:none; } }
    @keyframes floaty    { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
    @keyframes shake     { 10%,90%{transform:translateX(-2px)} 30%,70%{transform:translateX(4px)} 50%{transform:translateX(-4px)} }
    @keyframes nudgeR    { 0%,100% { transform: translateX(0); opacity:.5 } 50% { transform: translateX(12px); opacity:1 } }
    @keyframes bar       { from { width: 0 } to { width: 100% } }
    @keyframes barGrow   { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    @keyframes barPulse  { 0%,100% { transform: scaleY(1); } 45% { transform: scaleY(.82); } }
    @keyframes ringFill  { from { stroke-dashoffset: 163.4; } to { stroke-dashoffset: 49; } }
    @keyframes flicker   { 0%,100% { transform: scale(1) rotate(-2deg); } 50% { transform: scale(1.08) rotate(2deg); } }
    @keyframes trendDraw { to { stroke-dashoffset: 0; } }
    @keyframes pulseRing { 0%,100% { box-shadow: 0 0 0 0 rgba(16,185,129,.35); } 50% { box-shadow: 0 0 0 5px rgba(16,185,129,0); } }
    @keyframes twinkle   { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.8); } }
    @keyframes flameFlicker { from { transform: scaleY(1) scaleX(1); } to { transform: scaleY(.8) scaleX(1.15); } }
    @keyframes growRight  { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes spinLoop   { to { transform: rotate(360deg); } }
    @keyframes fadeDrift  { 0%,100% { opacity: .35; } 50% { opacity: .7; } }
    @keyframes flyIn     { from { opacity:0; transform: translateY(-14px) rotate(-8deg); } to { opacity:1; transform: translateY(0) rotate(-3deg); } }
    @keyframes pulseSoft { 0%,100% { opacity:1; } 50% { opacity:.35; } }
    @keyframes sheen     { from { background-position: -180% 0 } to { background-position: 220% 0 } }
    @keyframes dashFlow  { to { stroke-dashoffset: -20; } }
    @keyframes radarPing { 0% { transform: scale(.4); opacity: .6; } 100% { transform: scale(2.2); opacity: 0; } }
    .connector-flow { animation: dashFlow .9s linear infinite; }
    .connector-ping { animation: radarPing 1.8s cubic-bezier(.25,.7,.4,1) infinite; }
    @keyframes connectorDrip { 0% { top: -4%; opacity: 0; transform: scale(.5); } 22% { opacity: 1; transform: scale(1); } 78% { opacity: 1; } 100% { top: 100%; opacity: 0; transform: scale(.5); } }
    .connector-drip { animation: connectorDrip 1.5s cubic-bezier(.4,0,.6,1) infinite; }
    @keyframes raceSlow { 0% { transform: scaleX(0); } 88%,100% { transform: scaleX(1); } }
    @keyframes raceFast { 0% { transform: scaleX(0); } 18%,100% { transform: scaleX(1); } }
    .race-slow { animation: raceSlow 3.6s cubic-bezier(.3,.1,.2,1) infinite; }
    .race-fast { animation: raceFast 3.6s cubic-bezier(.2,.8,.3,1) infinite; }
    @keyframes narrowNudge { 0%,55%,100% { transform: translateX(0); } 25% { transform: translateX(-14px); } }
    .narrow-nudge { animation: narrowNudge 1.6s ease-in-out infinite; }
    .anim-in-r        { animation: slideInR .34s cubic-bezier(.22,.9,.3,1) both; }
    .anim-in-l        { animation: slideInL .34s cubic-bezier(.22,.9,.3,1) both; }
    .animate-fadeUp   { animation: fadeUp .5s ease both; }
    .animate-revealUp { animation: revealUp .42s cubic-bezier(.22,.9,.3,1) both; }
    .animate-popIn    { animation: popIn .2s cubic-bezier(.2,.9,.3,1.15) both; }
    .animate-floaty   { animation: floaty 4s ease-in-out infinite; }
    .animate-shake    { animation: shake .4s ease both; }
    .animate-nudgeR   { animation: nudgeR 1.4s ease-in-out infinite; }
    .sheen { background-image: linear-gradient(105deg, transparent 38%, rgba(255,255,255,.55) 50%, transparent 62%);
             background-size: 220% 100%; animation: sheen 2.6s ease-in-out infinite; }

    .stagger > * { animation: fadeUp .44s ease both; }
    .stagger > *:nth-child(1){animation-delay:.04s} .stagger > *:nth-child(2){animation-delay:.10s}
    .stagger > *:nth-child(3){animation-delay:.16s} .stagger > *:nth-child(4){animation-delay:.22s}
    .stagger > *:nth-child(5){animation-delay:.28s} .stagger > *:nth-child(6){animation-delay:.34s}

    /* 슬라이드를 같은 그리드 칸에 겹쳐 쌓는다. 덱 높이가 고정되어 아래 컨트롤이 안 튄다. */
    .deck-stack { display: grid; }
    .deck-stack > * { grid-area: 1 / 1; min-height: 0; }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .rich b { font-weight: 800; color: #111827; }
    .rich i { font-style: normal; color: #6B7280; background:#F3F4F6; padding:.05em .35em; border-radius:.3em; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <!-- 설정 화면 스크린샷(base64). 용량이 커서 커리큘럼 데이터와 분리했다 -->
  <script src="assets.js"></script>
  <!-- 커리큘럼 데이터: Day 메타 + 슬라이드/퀴즈/미션 콘텐츠 -->
  <script src="data.js"></script>

  <script type="text/babel" data-presets="react-classic">
    const { useState, useEffect, useLayoutEffect, useMemo, useRef, useCallback, createContext, useContext } = React;
    const DATA = window.MJC_DATA;

    /* Day 타입별 앰비언트 컬러. 기획안 주석: concept 그린 · practice 앰버 · project 핑크 */
    const THEME = {
      concept: {
        label: "개념", emoji: "🟢", act: "퀴즈",
        text: "text-emerald-700", textSoft: "text-emerald-600",
        bg: "bg-emerald-50", border: "border-emerald-200",
        solid: "bg-emerald-500", solidHover: "hover:bg-emerald-600",
        badge: "bg-emerald-100 text-emerald-700 border border-emerald-200",
        chip: "bg-emerald-500 text-white", bar: "bg-emerald-500", ring: "ring-emerald-300",
      },
      practice: {
        label: "실습", emoji: "🟡", act: "미션",
        text: "text-amber-700", textSoft: "text-amber-600",
        bg: "bg-amber-50", border: "border-amber-200",
        solid: "bg-amber-500", solidHover: "hover:bg-amber-600",
        badge: "bg-amber-100 text-amber-700 border border-amber-200",
        chip: "bg-amber-500 text-white", bar: "bg-amber-500", ring: "ring-amber-300",
      },
      project: {
        label: "프로젝트", emoji: "🚀", act: "미션",
        text: "text-pink-700", textSoft: "text-pink-600",
        bg: "bg-pink-50", border: "border-pink-200",
        solid: "bg-pink-500", solidHover: "hover:bg-pink-600",
        badge: "bg-pink-100 text-pink-700 border border-pink-200",
        chip: "bg-pink-500 text-white", bar: "bg-pink-500", ring: "ring-pink-300",
      },
    };

    /* 유틸 */
    function go(hash) { window.location.hash = hash; window.scrollTo({ top: 0, behavior: "auto" }); }
    function useHashRoute() {
      const [route, setRoute] = useState(window.location.hash || "#/day/1");
      useEffect(() => {
        const on = () => setRoute(window.location.hash || "#/day/1");
        window.addEventListener("hashchange", on);
        return () => window.removeEventListener("hashchange", on);
      }, []);
      return route;
    }
    function showToast(msg) {
      const t = document.createElement("div");
      t.textContent = msg;
      t.className = "fixed left-1/2 -translate-x-1/2 bottom-10 z-[300] px-4 py-2.5 rounded-full bg-ink text-white text-sm font-bold shadow-lift animate-popIn";
      document.body.appendChild(t);
      setTimeout(() => { t.style.transition = "opacity .3s"; t.style.opacity = "0"; }, 1400);
      setTimeout(() => t.remove(), 1800);
    }
    function loadLS(k, f) { try { const v = localStorage.getItem(k); return v == null ? f : JSON.parse(v); } catch (e) { return f; } }
    function saveLS(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
    function fill(t, n) { return (t || "").split("{{name}}").join(n || DATA.DEMO_NAME); }
    const strip = (s) => (s || "").replace(/<[^>]+>/g, "");

    function RichInline({ text, name, className }) {
      return <span className={"rich " + (className || "")} dangerouslySetInnerHTML={{ __html: fill(text, name) }} />;
    }

    /* Day 테마 색으로 채워지는 기본 CTA 버튼. disabled 면 회색으로 빠진다.
       size: "base" | "lg" · layout: "full" | "flex1" · extra: 추가로 붙일 클래스(애니메이션 등) */
    function ThemedCTA({ theme, disabled, onClick, size, layout, extra, children }) {
      const sizeCls = size === "lg" ? "py-4 text-lg" : "py-3.5 text-base";
      const layoutCls = layout === "flex1" ? "flex-1" : "w-full";
      return (
        <button disabled={disabled} onClick={onClick}
          className={layoutCls + " " + sizeCls + " rounded-2xl font-black shadow-card transition active:scale-[.99] " + (extra || "") + " " +
            (disabled ? "bg-gray-200 text-gray-400 cursor-not-allowed" : "text-white " + theme.solid + " " + theme.solidHover)}>
          {children}
        </button>
      );
    }

    async function copyText(t) {
      try { await navigator.clipboard.writeText(t); showToast("복사했어요 📋"); }
      catch (e) { showToast("복사에 실패했어요. 직접 선택해 주세요"); }
    }
    function downloadBlob(filename, text, mime) {
      const blob = new Blob(["﻿" + text], { type: (mime || "text/plain") + ";charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showToast(filename + " 내려받았어요 ⬇️");
    }

    const UICtx = createContext({});
    const useUI = () => useContext(UICtx);
    const PLAN_NOTES = /[?&]notes=1/.test(window.location.search);

    /* 떠 있는 버튼. 항상 보이도록 모든 단계에서 렌더한다.
       liftForHint 가 켜지면(모바일에서 스플릿스크린 배너가 하단에 떠 있을 때) 배너 위로 자리를 옮긴다. */
    function Fabs({ liftForHint }) {
      const { openGrid, openName } = useUI();
      return (
        <div className={"fixed right-5 z-[150] flex flex-col gap-2.5 transition-[bottom] duration-200 " +
          (liftForHint ? "bottom-36 lg:bottom-5" : "bottom-5")}>
          <button onClick={openName} title="내 이름 설정"
            className="w-11 h-11 rounded-full bg-white border border-gray-200 text-gray-500 grid place-items-center text-lg shadow-soft hover:scale-105 transition">🦁</button>
          <button onClick={openGrid} title="전체 목차"
            className="w-14 h-14 rounded-full bg-ink text-white grid place-items-center text-2xl shadow-lift hover:scale-105 transition">📚</button>
        </div>
      );
    }

    /* 학습 화면 전용 - 화면 높이가 빠듯해서 목차 버튼 하나만, 작게. 이름 설정은 상단 바에 따로 둔다. */
    function LearnFab({ liftForHint }) {
      const { openGrid } = useUI();
      return (
        <button onClick={openGrid} title="전체 목차"
          className={"fixed right-5 z-[150] w-11 h-11 rounded-full bg-ink text-white grid place-items-center text-xl shadow-lift hover:scale-105 transition-[bottom] duration-200 " +
            (liftForHint ? "bottom-24 lg:bottom-3" : "bottom-3")}>📚</button>
      );
    }

    /* 진행상황 */
    function useProgress() {
      const [done, setDone] = useState(() => loadLS("mjc.done", []));
      const complete = useCallback((n) => {
        setDone((d) => { if (d.indexOf(n) !== -1) return d; const x = d.concat([n]).sort((a, b) => a - b); saveLS("mjc.done", x); return x; });
      }, []);
      const isDone = useCallback((n) => done.indexOf(n) !== -1, [done]);
      return { done, isDone, complete };
    }

    /* 스플릿스크린 감지 */
    function isSplitNow() {
      const avail = (window.screen && window.screen.availWidth) || 0;
      const w = window.outerWidth || window.innerWidth || 0;
      if (!avail || !w) return true;
      return w / avail <= 0.72;
    }
    function useSplitScreen() {
      const [split, setSplit] = useState(isSplitNow);
      useEffect(() => {
        const on = () => setSplit(isSplitNow());
        window.addEventListener("resize", on);
        const id = setInterval(on, 1200);
        return () => { window.removeEventListener("resize", on); clearInterval(id); };
      }, []);
      return split;
    }

    /* 너무 좁은 스플릿스크린 감지 - 마우스로 조작하는(터치가 아닌) 창이 비정상적으로 좁을 때만 잡는다.
       화면 자체가 좁은 폰·태블릿은 정상 사용이라 건드리지 않는다.
       screen.availWidth 로 "데스크탑인지"를 판단하면 브라우저 창 크기를 조정할 때 그 값도 같이
       바뀌는 경우가 있어 신뢰할 수 없다 - 대신 주 입력 장치가 마우스인지(pointer: fine)로 구분한다.
       maxTouchPoints > 0 만으로는 안 된다 - 터치스크린 노트북도 실제로는 마우스·트랙패드로 쓰는
       경우가 많아서, 그 신호만 보면 정작 좁혀야 할 사람을 놓친다 */
    const MIN_USABLE_WIDTH = 460;
    function isTooNarrowNow() {
      const w = window.innerWidth || 0;
      if (!w) return false;
      const mouseIsPrimary = !window.matchMedia || window.matchMedia("(pointer: fine)").matches;
      if (!mouseIsPrimary) return false;
      return w < MIN_USABLE_WIDTH;
    }
    function useNarrowGuard() {
      const [narrow, setNarrow] = useState(isTooNarrowNow);
      useEffect(() => {
        const on = () => setNarrow(isTooNarrowNow());
        window.addEventListener("resize", on);
        const id = setInterval(on, 1000);
        return () => { window.removeEventListener("resize", on); clearInterval(id); };
      }, []);
      return narrow;
    }

    function NarrowScreenGuard() {
      return (
        <div className="fixed inset-0 z-[500] bg-ink/95 backdrop-blur-sm flex items-center justify-center p-6 text-center animate-fadeUp">
          <div className="max-w-[260px]">
            <div className="relative w-32 h-16 mx-auto overflow-hidden rounded-2xl border border-white/15">
              <div className="absolute inset-y-0 left-0 w-1/2 bg-brand-500/25" />
              <div className="absolute inset-y-0 right-0 w-1/2 bg-white/10" />
              <div className="absolute inset-y-2 w-[3px] rounded-full bg-white narrow-nudge" style={{ left: "50%", marginLeft: "-1.5px" }} />
              <span className="absolute text-xl narrow-nudge" style={{ top: "50%", left: "50%", marginTop: "-12px", marginLeft: "-10px" }}>🖱️</span>
            </div>
            <div className="mt-5 text-lg font-black text-white leading-snug">너무 좁아요!<br />숨쉴 수 있게 조금만 크게 늘려주세요</div>
            <p className="mt-2.5 text-xs text-white/60 leading-relaxed">가운데 화면 경계선을 살짝 왼쪽으로 끌어주시면 넓어져요</p>
          </div>
        </div>
      );
    }

    function SplitScreenHint({ onDismiss }) {
      return (
        <>
          <div className="hidden lg:block fixed inset-y-0 right-0 z-[160] w-[38vw] max-w-[560px] pointer-events-none">
            <div className="absolute inset-4 rounded-3xl border-[3px] border-dashed border-brand-400/70 bg-brand-500/[.06] grid place-items-center">
              <div className="text-center px-6 pointer-events-auto">
                <div className="text-5xl animate-floaty">🖥️</div>
                <div className="mt-4 text-xl font-black text-brand-700 leading-snug">오른쪽 화면에<br />Claude 데스크탑을 띄워주세요</div>
                <p className="mt-3 text-sm text-brand-600/80 leading-relaxed">
                  실습·프로젝트 Day는 <b>스플릿스크린</b>이 기본 자세예요.<br />왼쪽 = 이 챌린지 페이지 · 오른쪽 = 클로드
                </p>
                <div className="mt-4 text-xs text-brand-500/70 font-bold">
                  Windows <span className="px-1.5 py-0.5 rounded bg-white/70 border border-brand-200">⊞ + ←</span>
                  <span className="mx-1.5">/</span>
                  Mac <span className="px-1.5 py-0.5 rounded bg-white/70 border border-brand-200">초록 버튼 길게</span>
                </div>
                <button onClick={onDismiss} className="mt-5 rounded-xl bg-white border border-brand-200 px-4 py-2 text-xs font-bold text-brand-600 hover:bg-brand-50 transition">알겠어요, 닫기</button>
              </div>
            </div>
          </div>
          <div className="hidden lg:flex fixed top-1/2 -translate-y-1/2 right-[38vw] z-[161] items-center gap-1 pointer-events-none" style={{ marginRight: "8px" }}>
            {[0, 1, 2].map((n) => (
              <span key={n} className="text-3xl text-brand-500 animate-nudgeR" style={{ animationDelay: n * 0.16 + "s" }}>›</span>
            ))}
          </div>
          <div className="lg:hidden fixed bottom-0 inset-x-0 z-[160] p-3">
            <div className="rounded-2xl bg-ink text-white p-4 shadow-lift flex items-start gap-3">
              <span className="text-2xl shrink-0">🖥️</span>
              <div className="flex-1">
                <div className="font-black text-sm">오른쪽 화면에 Claude 데스크탑을 띄워주세요</div>
                <p className="mt-1 text-xs text-white/70 leading-relaxed">화면을 반으로 나눠서 진행해요. 왼쪽 = 이 페이지 · 오른쪽 = 클로드</p>
              </div>
              <button onClick={onDismiss} className="shrink-0 rounded-lg bg-white/15 px-2.5 py-1 text-xs font-bold hover:bg-white/25 transition">닫기</button>
            </div>
          </div>
        </>
      );
    }

    /* 내 노트 */
    const noteKey = (d) => "mjc.note." + d;

    function NotePanel({ day, meta, onClose }) {
      const [text, setText] = useState(() => loadLS(noteKey(day), ""));
      const [flash, setFlash] = useState(false);
      const taRef = useRef(null);
      const panelRef = useRef(null);
      const dragRef = useRef(null);
      const [pos, setPos] = useState(null); // null = 기본 위치(우하단), 드래그하면 픽셀 좌표로 고정
      const [dragging, setDragging] = useState(false);

      useEffect(() => { setText(loadLS(noteKey(day), "")); }, [day]);
      useEffect(() => { if (taRef.current) taRef.current.focus(); }, []);

      const update = (v) => {
        setText(v); saveLS(noteKey(day), v);
        setFlash(true); clearTimeout(update._t);
        update._t = setTimeout(() => setFlash(false), 900);
      };
      const stamp = () => new Date().toISOString().slice(0, 10);
      const header = "멋쟁이 챌린지 · Day " + day + " : " + meta.name + "\n" + meta.chapter + " · " + meta.chapterTitle +
                     "\n작성일 " + stamp() + "\n" + "─".repeat(40) + "\n\n";

      const saveOne = () => {
        if (!text.trim()) return showToast("먼저 노트를 작성해 주세요 ✍️");
        downloadBlob("멋쟁이챌린지 Day " + day + " 노트.txt", header + text, "text/plain");
      };

      /* 헤더를 드래그해서 패널을 화면 어디로든 옮길 수 있게 한다 */
      const onDragStart = (e) => {
        if (e.target.closest("button")) return;
        const rect = panelRef.current.getBoundingClientRect();
        dragRef.current = { startX: e.clientX, startY: e.clientY, origX: rect.left, origY: rect.top };
        setPos({ x: rect.left, y: rect.top });
        setDragging(true);
        e.currentTarget.setPointerCapture(e.pointerId);
      };
      const onDragMove = (e) => {
        if (!dragRef.current) return;
        const w = panelRef.current.offsetWidth, h = panelRef.current.offsetHeight;
        const maxX = Math.max(4, window.innerWidth - w - 4);
        const maxY = Math.max(4, window.innerHeight - h - 4);
        const x = Math.min(Math.max(4, dragRef.current.origX + (e.clientX - dragRef.current.startX)), maxX);
        const y = Math.min(Math.max(4, dragRef.current.origY + (e.clientY - dragRef.current.startY)), maxY);
        setPos({ x, y });
      };
      const onDragEnd = () => { dragRef.current = null; setDragging(false); };

      const posStyle = pos ? { left: pos.x + "px", top: pos.y + "px", right: "auto", bottom: "auto" } : undefined;

      return (
        <div ref={panelRef}
          className={"fixed z-[210] inset-x-3 bottom-3 sm:inset-x-auto sm:right-5 sm:bottom-24 sm:w-[360px] " + (dragging ? "" : "animate-popIn")}
          style={posStyle}>
          <div className="rounded-3xl bg-white border border-gray-200 shadow-lift overflow-hidden">
            <div onPointerDown={onDragStart} onPointerMove={onDragMove} onPointerUp={onDragEnd} onPointerCancel={onDragEnd}
              title="드래그해서 옮길 수 있어요"
              className={"flex items-center gap-2 px-4 py-3 bg-ink text-white select-none " + (dragging ? "cursor-grabbing" : "cursor-grab")}
              style={{ touchAction: "none" }}>
              <span className="text-white/40 text-sm leading-none">⠿</span>
              <span className="text-base">📝</span>
              <div className="flex-1 min-w-0">
                <div className="text-sm font-black truncate">Day {day} 노트</div>
                <div className="text-[10px] text-white/50 truncate">{meta.name}</div>
              </div>
              <button onClick={onClose} className="shrink-0 w-7 h-7 rounded-full bg-white/15 hover:bg-white/25 grid place-items-center text-xs transition">✕</button>
            </div>
            <textarea ref={taRef} value={text} onChange={(e) => update(e.target.value)}
              placeholder={"오늘 배운 것 중 기억하고 싶은 걸 적어두세요.\n\n· 다시 볼 개념\n· 클로드에게 써먹을 프롬프트\n· 막혔던 지점"}
              className="w-full h-52 p-4 text-sm leading-relaxed resize-none outline-none placeholder:text-gray-300" />
            <div className="flex items-center gap-2 px-3 py-2.5 bg-gray-50 border-t border-gray-200">
              <span className={"text-[11px] font-bold " + (flash ? "text-emerald-600" : "text-gray-400")}>
                {flash ? "저장됨 ✓" : text.length + "자 · 자동 저장"}
              </span>
              <button onClick={saveOne}
                className="ml-auto rounded-lg bg-brand-500 hover:bg-brand-600 px-3 py-1.5 text-[11px] font-black text-white transition">⬇ .txt 저장</button>
            </div>
          </div>
        </div>
      );
    }

    /* 헤더 */
    function TopHeader({ subtitle, badge, progress }) {
      const { openGrid } = useUI();
      return (
        <header className="relative z-40 shrink-0 backdrop-blur bg-cream/90 border-b border-brand-100/70">
          {progress != null && (
            <div className="absolute inset-x-0 top-0 h-0.5 bg-brand-100/60">
              <div className="h-full bg-brand-500 transition-all duration-500 ease-out" style={{ width: (progress * 100).toFixed(1) + "%" }} />
            </div>
          )}
          <div className="max-w-4xl mx-auto px-4 h-14 flex items-center gap-3">
            <button onClick={() => go("#/day/1")} className="shrink-0" title="처음으로">
              <img src="likelion-logo.svg" alt="멋쟁이사자처럼" className="h-5 w-auto" />
            </button>
            {subtitle && <span className="text-sm font-bold text-gray-400 truncate">{subtitle}</span>}
            <div className="ml-auto flex items-center gap-2 shrink-0">

    }

    /* 전체 목차 */
    function mediaCount(dayNum) {
      const content = DATA.authored[dayNum];
      if (!content || !content.slides) return 0;
      return content.slides.filter((s) => (s.img && DATA.SHOTS[s.img]) || s.video).length;
    }
    function ChapterGrid({ onPick, onClose, currentDay }) {
      const byCode = {};
      DATA.days.forEach((d) => { (byCode[d.chapter] = byCode[d.chapter] || []).push(d); });
      return (
        <div className="fixed inset-0 z-[200] bg-black/50 backdrop-blur-sm flex items-end sm:items-center justify-center" onClick={onClose}>
          <div className="bg-cream w-full sm:max-w-6xl sm:rounded-3xl rounded-t-3xl max-h-[90vh] overflow-y-auto p-5 sm:p-8 shadow-lift animate-popIn"
               onClick={(e) => e.stopPropagation()}>
            <div className="flex items-start gap-3">
              <div>
                <div className="text-xl font-black text-ink">📚 전체 목차</div>
                <div className="text-sm text-gray-400 mt-0.5">

            <div className="mt-5 grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
              {DATA.chapters.map((ch) => (
                <div key={ch.code} className={"rounded-2xl border p-4 " + (ch.milestone ? "bg-brand-50 border-brand-300" : "bg-white border-brand-100")}>
                  <div className="flex items-center justify-between mb-1 gap-2">

                          <span className={"text-xs truncate " + (cur ? "text-white" : "text-ink")}>{d.name}</span>
                          {media > 0 && (

              {DATA.upcoming.map((u) => (

                    {(u.days || []).map((d) => {

    /* ═══ 슬라이드 덱 ═══════════════════════════════════════════
       한 번에 한 포인트씩 공개하고, 덱 높이는 뷰포트에 맞춰 고정한다.
    ═══════════════════════════════════════════════════════════ */
    const parasOf = (s, n) => fill(s.body, n).split("\n\n").filter((p) => p.trim());
    /* 이미지·비디오·visual 은 슬라이드에 들어오는 순간 통째로 뜨고 별도 reveal 계단을 먹지 않는다 -
       계단은 문단 수만큼만 있다 */
    const stepsOf = (s, n) => parasOf(s, n).length;

    /* 로드맵 슬라이드용 미니 아이콘 - 문장마다 어울리는 작은 애니메이션을 하나씩 붙인다.
       전부 등장 애니메이션이 끝나도 멈춰 보이지 않도록, 하나씩은 계속 움직이는 요소를 남겨둔다. */
    function RoadmapVisual({ kind }) {
      const wrap = "w-16 h-16 shrink-0 rounded-2xl bg-brand-50 border border-brand-100 grid place-items-center relative overflow-hidden";
      if (kind === "chart") {
        const bars = [{ x: 7, h: 20, d: 0 }, { x: 23, h: 34, d: .09 }, { x: 39, h: 15, d: .18 }, { x: 55, h: 41, d: .27 }];
        return (
          <div className={wrap}>
            <svg viewBox="0 0 71 50" className="w-10 h-7">
              <line x1="1" y1="48" x2="70" y2="48" stroke="#FFD9C2" strokeWidth="2" strokeLinecap="round" />
              {bars.map((b, i) => (
                <rect key={i} x={b.x} y={48 - b.h} width="10" height={b.h} rx="2.3" className="fill-brand-500"
                  style={{ transformBox: "fill-box", transformOrigin: "bottom",
                    /* 처음 자라나는 barGrow가 끝나면 이어서 barPulse가 계속 움직여, 다 자란 뒤에도 멈춰 있지 않고 살아있는 느낌을 준다 */
                    animation: "barGrow .5s " + b.d + "s cubic-bezier(.2,.9,.3,1.1) both, barPulse 1.7s ease-in-out " + (b.d + .55) + "s infinite" }} />
              ))}
              <path d="M7 30 L23 15 L39 34 L55 8" fill="none" className="stroke-brand-300" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"
                style={{ strokeDasharray: 70, strokeDashoffset: 70, animation: "trendDraw .7s .35s cubic-bezier(.2,.9,.3,1) both" }} />
            </svg>
          </div>
        );
      }
      if (kind === "automate") {
        return (
          <div className={wrap}>
            <svg viewBox="0 0 48 36" className="w-9 h-7">
              <rect x="1" y="1" width="46" height="34" rx="5" fill="white" className="stroke-brand-400" strokeWidth="2.5" />
              <path d="M2 3 L24 20 L46 3" fill="none" className="stroke-brand-400" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
            </svg>
            <span className="absolute right-1 bottom-1 w-6 h-6 rounded-full bg-emerald-500 text-white grid place-items-center text-[11px] font-black shadow-soft"
              style={{ animation: "popIn .3s .55s cubic-bezier(.2,.9,.3,1.15) both, pulseRing 1.8s .9s ease-in-out infinite" }}>✓</span>
          </div>
        );
      }
      if (kind === "deploy") {
        return (
          <div className={wrap}>
            <div className="w-12 rounded-lg border border-brand-200 bg-white overflow-hidden shadow-soft">
              <div className="h-3 bg-brand-100 flex items-center gap-0.5 px-1.5">
                <span className="w-1.5 h-1.5 rounded-full bg-brand-300" /><span className="w-1.5 h-1.5 rounded-full bg-brand-300" /><span className="w-1.5 h-1.5 rounded-full bg-brand-300" />
              </div>
              <div className="p-2">
                <div className="h-2 rounded-full bg-brand-100 overflow-hidden">
                  <div className="h-full bg-brand-500" style={{ animation: "bar .6s .1s ease-out both" }} />
                </div>
                <div className="mt-2 flex items-center gap-1">
                  <span className="w-2 h-2 rounded-full bg-emerald-500"
                    style={{ animation: "popIn .25s .75s both, pulseSoft 1.6s .95s ease-in-out infinite" }} />
                  <span className="text-[8px] font-black text-emerald-600" style={{ animation: "popIn .25s .8s both" }}>LIVE</span>
                </div>
              </div>
            </div>

        );

      if (kind === "assistant") {
        return (
          <div className={wrap}>
            <svg viewBox="0 0 56 44" className="w-10 h-8 absolute bottom-2">
              <path d="M2 12 L2 38 Q2 41 5 41 L51 41 Q54 41 54 38 L54 16 Q54 13 51 13 L26 13 L22 8 L5 8 Q2 8 2 11 Z" className="fill-brand-400" />

          </div>
        );
      }
      return null;
    }

    /* 텍스트가 많던 슬라이드를 시각화로 바꾸며 새로 그린 라인 아이콘 세트 - 이모지 대신 이 파일의

    function IconNoEntry() {

    /* ── 개념 Day 본문 자동 디자인 ─────────────────────────────────
       「🟢 …」「✅ …」「1️⃣ …」처럼 머리기호로 시작하는 줄은 카드로,
       그 아래 「· …」 줄은 그 카드에 딸린 항목으로 세운다. 본문 데이터를
       새로 쓰지 않아도 기존 문단이 그대로 카드가 되는 게 요점.
    ═══════════════════════════════════════════════════════════ */
    const LEAD = /^((?:[0-9]️?⃣)|(?:\p{Extended_Pictographic}[️‍]*)+)\s+(.+)$/u;
    const SUB = /^[·•]\s+(.+)$/;

    function parseBlocks(html) {
      const head = [], items = [];
      let cur = null;
      html.split("\n").map((l) => l.trim()).filter(Boolean).forEach((l) => {
        const lead = LEAD.exec(l), sub = SUB.exec(l);
        if (lead) { cur = { icon: lead[1], text: lead[2], subs: [] }; items.push(cur); }
        else if (sub) { if (cur) cur.subs.push({ t: sub[1], dot: true }); else items.push({ bullet: true, text: sub[1] }); }
        else if (cur) cur.subs.push({ t: l, dot: false });   /* 카드 제목 아래 설명 줄 */
        else head.push(l);
      });
      return { head: head.join("<br/>"), items };
    }

    function ParaBlock({ html }) {
      const parsed = useMemo(() => parseBlocks(html), [html]);
      const plain = "rich text-[14px] sm:text-[14.5px] text-gray-700 leading-[1.7]";
      if (!parsed.items.length) {
        return <p className={plain} dangerouslySetInnerHTML={{ __html: html.split("\n").join("<br/>") }} />;
      }
      return (
        <div className="space-y-2">
          {parsed.head && <p className={plain} dangerouslySetInnerHTML={{ __html: parsed.head }} />}
          {/* 항목이 둘 이상이면 2열로 흘려 세로 길이를 절반으로 줄인다.
              비교(일반 대화 vs 연구 모드)나 목록(켜세요/안 켜도 돼요) 모두 나란히 놓는 게 읽기도 낫다 */}
          <div className={"grid gap-1.5 " + (parsed.items.length >= 2 ? "sm:grid-cols-2" : "")}>
            {parsed.items.map((it, i) => it.bullet ? (
              <div key={i} className="flex items-start gap-2 rounded-xl bg-white border border-gray-100 px-3 py-1.5">
                <span className="mt-[7px] w-1.5 h-1.5 rounded-full bg-brand-400 shrink-0" />
                <span className="rich flex-1 min-w-0 text-[13px] text-gray-700 leading-[1.6]"
                      dangerouslySetInnerHTML={{ __html: it.text }} />
              </div>
            ) : (
              <div key={i} className="flex items-start gap-2.5 rounded-2xl bg-white border border-gray-100 px-3 py-2.5">
                <span className="shrink-0 w-6 text-center text-[15px] leading-[1.45]">{it.icon}</span>
                <div className="flex-1 min-w-0">
                  <div className="rich text-[13px] text-gray-700 leading-[1.6]" dangerouslySetInnerHTML={{ __html: it.text }} />
                  {it.subs.length > 0 && (
                    <div className="mt-1.5 space-y-1">
                      {it.subs.map((s, j) => (
                        <div key={j} className="flex items-start gap-1.5">
                          {s.dot && <span className="mt-[7px] w-1 h-1 rounded-full bg-brand-300 shrink-0" />}
                          <span className="rich flex-1 min-w-0 text-[12.5px] text-gray-500 leading-[1.55]"
                                dangerouslySetInnerHTML={{ __html: s.t }} />
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    /* 문단은 항상 전부(최종 높이 기준으로) 그려 넣고, 아직 안 열린 것만 visibility로 숨긴다.
       이렇게 해야 클릭할 때마다 레이아웃 높이가 바뀌면서 이미 보이던 글이 위로 밀려 올라가는 일이 없다.
       공개되는 순간에만 key를 바꿔 그 문단만 새로 마운트시켜, 그때 딱 한 번 페이드업 애니메이션이 재생되게 한다.
       (SlideBody 안에서 정의하면 렌더마다 새 함수가 되어 매 클릭마다 전부 리마운트되니, 여기 모듈 스코프에 둔다) */
    function RevealPara({ i, reveal, children }) {
      const on = i < reveal;
      return (
        <div key={on ? "on" : "off"} className={on ? "animate-revealUp" : "invisible"}>
          {children}
        </div>
      );
    }

    /* 기능 소개 카드 - 이모지 목록 대신 아이콘 칩 + 눌러서 펼치는 설명으로.
       kind 마다 다른 심볼과 은은한 상시 애니메이션을 붙여, 멈춰 있는 카드가 하나도 없게 한다. */
    const FEATURE_TONE = {
      sky:     "bg-sky-100 text-sky-600",
      violet:  "bg-violet-100 text-violet-600",
      amber:   "bg-amber-100 text-amber-600",
      emerald: "bg-emerald-100 text-emerald-600",
      rose:    "bg-rose-100 text-rose-600",

    function FeatureIcon({ kind }) {

              <svg viewBox="0 0 20 20" className="w-2 h-2" fill="none" stroke="white" strokeWidth="3" strokeLinecap="round"><path d="M6 6 L14 14 M14 6 L6 14" /></svg>

    function FeatureCard({ icon, tone, title, desc, open, onToggle, delay }) {

    function FeatureCardsGrid({ intro, cards, outro, active }) {
      const [open, setOpen] = useState(0);
